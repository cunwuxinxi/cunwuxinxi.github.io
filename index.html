    <!-- ===== 登录覆盖层 ===== -->
    <div id="loginOverlay">
        <div class="login-box">
            <div class="logo"><i class="fas fa-flag"></i></div>
            <h2>党建引领 · 村务平台</h2>
            <div class="sub">请输入用户名和密码登录</div>
            <div id="loginError" class="login-error" style="display:none;"></div>
            <div class="form-group">
                <label><i class="fas fa-user" style="margin-right:6px;color:var(--gold);"></i> 用户名</label>
                <input type="text" id="loginUsername" placeholder="admin" value="admin" />
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock" style="margin-right:6px;color:var(--gold);"></i> 密码</label>
                <input type="password" id="loginPassword" placeholder="密码" value="123456" />
            </div>
            <div class="form-actions">
                <button class="btn-login" onclick="handleLogin()"><i class="fas fa-sign-in-alt"></i> 登录</button>
                <button class="btn-register" onclick="handleRegister()"><i class="fas fa-user-plus"></i> 注册</button>
            </div>
            <div class="footer-note">默认账号 admin / 123456</div>
        </div>
    </div>

    <!-- ===== 主界面 ===== -->
    <header class="topbar" id="mainApp" style="display:none;">
        <div class="brand">
            <span class="icon-wrapper" id="iconWrapper" onclick="changeIcon()">
                <i id="brandIcon" class="fas fa-star"></i>
                <img id="brandIconImg" style="display:none;" alt="Icon" />
            </span>
            <span class="title-text" id="platformTitleDisplay">党建引领 · 村务信息平台</span>
            <button class="edit-title" onclick="editPlatformTitle()" title="修改平台标题"><i class="fas fa-pen"></i></button>
            <small>村务版 v2.5</small>
        </div>
        <div class="datetime-display" id="currentDateTime"></div>
        <div class="actions">
            <button onclick="exportAllData()" title="导出所有数据（JSON）"><i class="fas fa-download"></i> 导出数据</button>
            <button onclick="document.getElementById('importDataFile').click()" title="导入数据（JSON）"><i class="fas fa-upload"></i> 导入数据</button>
            <input type="file" id="importDataFile" class="hidden-input" accept=".json" onchange="importAllData(event)" />
            <button onclick="logout()" class="danger" title="退出登录"><i class="fas fa-sign-out-alt"></i> 退出</button>
        </div>
    </header>

    <div class="main-wrap" id="mainAppContent" style="display:none;">
        <nav class="sidebar" id="moduleList">
            <div class="module-count" id="moduleCount">共 0 个模块</div>
        </nav>

        <main class="content" id="contentArea">
            <div class="panel-header">
                <h2><i class="fas fa-folder-open"></i> <span id="currentModuleTitle">请选择模块</span></h2>
                <div class="toolbar" id="toolbarContainer"></div>
            </div>

            <!-- 模块内搜索栏 -->
            <div class="search-bar" id="searchBar" style="display:none;">
                <input type="text" id="searchInput" placeholder="🔍 搜索当前模块（标题/内容）..." />
                <button class="search-btn" onclick="searchRecords()"><i class="fas fa-search"></i> 搜索</button>
                <button class="clear-btn" onclick="clearSearch()"><i class="fas fa-times"></i> 清除</button>
                <span class="search-info" id="searchInfo"></span>
            </div>

            <div class="table-wrap" id="tableWrap">
                <div class="empty-tip">
                    <i class="fas fa-inbox"></i>
                    请从左侧选择一个模块，或添加新模块开始使用
                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box" id="modalBox">
            <h3 id="modalTitle"><i class="fas fa-edit"></i> <span>标题</span></h3>
            <div id="modalBody"></div>
        </div>
    </div>

    <div class="toast-msg" id="toast"></div>

    <script>
        // ============================================================
        //  完整 JavaScript
        // ============================================================

        // ---- 用户认证管理 ----
        const USER_KEY = 'villageUsers';
        const SESSION_KEY = 'villageSession';

        function getUsers() {
            try {
                const raw = localStorage.getItem(USER_KEY);
                if (raw) return JSON.parse(raw);
            } catch (e) {}
            return {};
        }

        function saveUsers(users) {
            localStorage.setItem(USER_KEY, JSON.stringify(users));
        }

        function getSession() {
            return localStorage.getItem(SESSION_KEY) || null;
        }

        function setSession(username) {
            localStorage.setItem(SESSION_KEY, username);
        }

        function clearSession() {
            localStorage.removeItem(SESSION_KEY);
        }

        function initUsers() {
            const users = getUsers();
            if (!users.admin) {
                users.admin = '123456';
                saveUsers(users);
            }
        }
        initUsers();

        function handleLogin() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const errorEl = document.getElementById('loginError');
            errorEl.style.display = 'none';
            if (!username || !password) {
                errorEl.textContent = '请输入用户名和密码';
                errorEl.style.display = 'block';
                return;
            }
            const users = getUsers();
            if (users[username] && users[username] === password) {
                setSession(username);
                showMainApp();
                showToast('登录成功', 'success');
            } else {
                errorEl.textContent = '用户名或密码错误';
                errorEl.style.display = 'block';
            }
        }

        function handleRegister() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const errorEl = document.getElementById('loginError');
            errorEl.style.display = 'none';
            if (!username || !password) {
                errorEl.textContent = '请输入用户名和密码';
                errorEl.style.display = 'block';
                return;
            }
            if (password.length < 4) {
                errorEl.textContent = '密码至少4位';
                errorEl.style.display = 'block';
                return;
            }
            const users = getUsers();
            if (users[username]) {
                errorEl.textContent = '用户名已存在';
                errorEl.style.display = 'block';
                return;
            }
            users[username] = password;
            saveUsers(users);
            setSession(username);
            showMainApp();
            showToast('注册成功，已自动登录', 'success');
        }

        function logout() {
            if (confirm('确定要退出登录吗？')) {
                clearSession();
                location.reload();
            }
        }

        function showMainApp() {
            document.getElementById('loginOverlay').classList.add('hidden');
            document.getElementById('mainApp').style.display = 'flex';
            document.getElementById('mainAppContent').style.display = 'flex';
            document.getElementById('platformTitleDisplay').textContent = loadPlatformTitle();
            renderPlatformIcon();

            if (!window._clockInterval) {
                updateDateTime();
                window._clockInterval = setInterval(updateDateTime, 1000);
            }
            if (!window._appInitialized) {
                initPlatform();
                window._appInitialized = true;
            } else {
                renderModuleList();
                if (currentModuleId === DASHBOARD_ID) {
                    renderDashboard();
                } else if (currentModuleId) {
                    renderRecords(currentModuleId);
                }
            }
        }

        // ---- 实时时钟 ----
        function updateDateTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
            const weekday = weekdays[now.getDay()];
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const dateTimeStr = `${year}年${month}月${day}日 星期${weekday} ${hours}:${minutes}:${seconds}`;
            const el = document.getElementById('currentDateTime');
            if (el) el.textContent = dateTimeStr;
        }

        // ---- 数据层 ----
        const STORAGE_KEY = 'villagePlatformData';
        const DASHBOARD_CONFIG_KEY = 'dashboardConfig';
        const PLATFORM_TITLE_KEY = 'platformTitle';
        const PLATFORM_ICON_KEY = 'platformIcon';
        const PLATFORM_ICON_TYPE_KEY = 'platformIconType';
        const PLATFORM_ICON_DATA_KEY = 'platformIconData';
        const DASHBOARD_ID = 'dashboard';

        function getDefaultData() {
            return { modules: [], records: {} };
        }

        function loadData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (!parsed.records) parsed.records = {};
                    if (parsed.modules) {
                        const moduleIds = new Set(parsed.modules.map(m => m.id));
                        parsed.modules.forEach(m => {
                            if (m.fields === undefined) m.fields = ['标题', '内容', '日期'];
                            if (m.parentId === undefined || m.parentId === null || m.parentId === '' || m.parentId ===
                                'null' || m.parentId === 'undefined') {
                                m.parentId = null;
                            } else if (!moduleIds.has(m.parentId)) {
                                m.parentId = null;
                            }
                            if (m.documentHtml === undefined) m.documentHtml = null;
                            if (m.note === undefined) m.note = '';
                            if (m.visible === undefined) m.visible = true;
                        });
                    }
                    return parsed;
                }
            } catch (e) { console.warn('数据加载失败，使用默认数据', e); }
            return getDefaultData();
        }

        function saveData(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function loadPlatformTitle() {
            return localStorage.getItem(PLATFORM_TITLE_KEY) || '党建引领 · 村务信息平台';
        }
        function savePlatformTitle(title) {
            localStorage.setItem(PLATFORM_TITLE_KEY, title);
            document.getElementById('platformTitleDisplay').textContent = title;
        }

        function loadPlatformIcon() {
            return localStorage.getItem(PLATFORM_ICON_KEY) || 'fa-star';
        }
        function savePlatformIcon(iconClass) {
            localStorage.setItem(PLATFORM_ICON_KEY, iconClass);
            localStorage.removeItem(PLATFORM_ICON_TYPE_KEY);
            localStorage.removeItem(PLATFORM_ICON_DATA_KEY);
            renderPlatformIcon();
        }
        function loadPlatformIconType() {
            return localStorage.getItem(PLATFORM_ICON_TYPE_KEY) || 'font';
        }
        function savePlatformIconType(type) {
            localStorage.setItem(PLATFORM_ICON_TYPE_KEY, type);
        }
        function loadPlatformIconData() {
            return localStorage.getItem(PLATFORM_ICON_DATA_KEY) || null;
        }
        function savePlatformIconData(data) {
            localStorage.setItem(PLATFORM_ICON_DATA_KEY, data);
        }
        function renderPlatformIcon() {
            const type = loadPlatformIconType();
            const iconEl = document.getElementById('brandIcon');
            const imgEl = document.getElementById('brandIconImg');
            if (type === 'image') {
                const data = loadPlatformIconData();
                if (data) {
                    iconEl.style.display = 'none';
                    imgEl.style.display = 'block';
                    imgEl.src = data;
                } else {
                    iconEl.style.display = 'inline';
                    imgEl.style.display = 'none';
                    iconEl.className = 'fas ' + loadPlatformIcon();
                }
            } else {
                iconEl.style.display = 'inline';
                imgEl.style.display = 'none';
                iconEl.className = 'fas ' + loadPlatformIcon();
            }
        }

        function loadDashboardConfig() {
            try {
                const raw = localStorage.getItem(DASHBOARD_CONFIG_KEY);
                if (raw) {
                    const config = JSON.parse(raw);
                    if (config.modules && Array.isArray(config.modules)) {
                        config.modules.forEach(c => {
                            if (c.formulas === undefined) c.formulas = [];
                            if (c.visible === undefined) c.visible = true;
                            if (c.note === undefined) c.note = '';
                        });
                        return config;
                    }
                }
            } catch (e) {}
            return { modules: [] };
        }
        function saveDashboardConfig(config) {
            localStorage.setItem(DASHBOARD_CONFIG_KEY, JSON.stringify(config));
        }

        let appData = loadData();
        let dashboardConfig = loadDashboardConfig();

        appData.modules.forEach(mod => {
            if (!dashboardConfig.modules.find(c => c.id === mod.id)) {
                dashboardConfig.modules.push({ id: mod.id, visible: true, note: '', formulas: [] });
            }
        });
        saveDashboardConfig(dashboardConfig);

        // ---- 状态 ----
        let currentModuleId = null;
        let selectedIds = new Set();
        let isDashboardEditMode = false;
        let expandedNodes = new Set();
        let searchKeyword = '';
        let globalSearchKeyword = '';

        // ---- DOM 引用 ----
        const $ = id => document.getElementById(id);
        const moduleListEl = $('moduleList');
        const tableWrap = $('tableWrap');
        const currentModuleTitle = $('currentModuleTitle');
        const modalOverlay = $('modalOverlay');
        const modalTitle = $('modalTitle');
        const modalBody = $('modalBody');
        const toastEl = $('toast');
        const toolbarContainer = $('toolbarContainer');
        const searchBar = $('searchBar');
        const searchInput = $('searchInput');
        const searchInfo = $('searchInfo');

        let toastTimer = null;

        function showToast(msg, type = 'info', duration = 2200) {
            if (toastTimer) { clearTimeout(toastTimer);
                toastEl.classList.remove('show'); }
            toastEl.textContent = msg;
            toastEl.className = 'toast-msg ' + type;
            void toastEl.offsetWidth;
            toastEl.classList.add('show');
            toastTimer = setTimeout(() => {
                toastEl.classList.remove('show');
                toastTimer = null;
            }, duration);
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function getAllModules() {
            return appData.modules || [];
        }
        function getRootModules() {
            const all = getAllModules();
            const ids = new Set(all.map(m => m.id));
            return all.filter(m => !m.parentId || !ids.has(m.parentId));
        }
        function getChildModules(parentId) {
            return getAllModules().filter(m => m.parentId === parentId);
        }

        // ---- 图标更换 ----
        const presetIcons = ['fa-star', 'fa-flag', 'fa-crown', 'fa-gem', 'fa-fire', 'fa-bolt',
            'fa-leaf', 'fa-heart', 'fa-shield-alt', 'fa-handshake', 'fa-users', 'fa-tree'
        ];
        let tempIconFileData = null;

        function changeIcon() {
            tempIconFileData = null;
            const currentType = loadPlatformIconType();
            const currentIcon = loadPlatformIcon();
            const currentData = loadPlatformIconData();

            let html = `
                <h3><i class="fas fa-palette"></i> 更换顶部图标</h3>
                <div class="icon-select-grid">
            `;
            presetIcons.forEach(icon => {
                const selected = (currentType === 'font' && icon === currentIcon) ? 'selected' : '';
                html += `
                    <div class="icon-option ${selected}" onclick="selectIcon('${icon}')">
                        <i class="fas ${icon}"></i>
                        <div class="icon-label">${icon.replace('fa-','')}</div>
                    </div>
                `;
            });
            html += `
                </div>
                <div class="form-group">
                    <label>或输入自定义图标类名（如 fa-star）</label>
                    <input type="text" id="customIconInput" placeholder="fa-xxx" value="${currentType === 'font' ? currentIcon : ''}" />
                </div>
                <div class="form-group">
                    <label>上传自定义图片（支持 png, jpg, svg）</label>
                    <div class="icon-upload-area" id="iconUploadArea">
                        <input type="file" id="iconFileInput" accept=".png,.jpg,.jpeg,.gif,.svg" />
                        <div class="hint"><i class="fas fa-cloud-upload-alt"></i> 点击选择图片</div>
                    </div>
                    ${currentType === 'image' && currentData ? `<div class="icon-preview"><span>当前图片：</span><img src="${currentData}" alt="当前图标" /></div>` : ''}
                    <div class="file-selected" id="iconFileInfo"></div>
                </div>
                <div class="form-actions">
                    <button class="btn-cancel" onclick="closeModal()">取消</button>
                    <button class="btn-submit" onclick="confirmIconChange()">确认更换</button>
                </div>
            `;
            modalTitle.innerHTML = `<i class="fas fa-paint-brush"></i> 更换图标`;
            modalBody.innerHTML = html;
            modalOverlay.classList.add('show');

            const fileInput = document.getElementById('iconFileInput');
            const uploadArea = document.getElementById('iconUploadArea');
            const fileInfo = document.getElementById('iconFileInfo');

            uploadArea.addEventListener('click', () => fileInput.click());

            fileInput.addEventListener('change', function(e) {
                const file = this.files[0];
                if (!file) {
                    fileInfo.textContent = '';
                    tempIconFileData = null;
                    return;
                }
                fileInfo.textContent = `已选择：${file.name}`;
                const reader = new FileReader();
                reader.onload = function(e) {
                    tempIconFileData = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function selectIcon(icon) {
            document.querySelectorAll('.icon-option').forEach(el => el.classList.remove('selected'));
            const target = document.querySelector(`.icon-option .fas.${icon}`)?.closest('.icon-option');
            if (target) target.classList.add('selected');
            document.getElementById('customIconInput').value = icon;
            document.getElementById('iconFileInfo').textContent = '';
            tempIconFileData = null;
        }

        function confirmIconChange() {
            if (tempIconFileData) {
                savePlatformIconType('image');
                savePlatformIconData(tempIconFileData);
                renderPlatformIcon();
                closeModal();
                showToast('图标已更新为自定义图片', 'success');
                return;
            }
            const input = document.getElementById('customIconInput');
            let icon = input.value.trim();
            if (!icon) {
                showToast('请选择或输入图标', 'error');
                return;
            }
            if (!icon.startsWith('fa-')) {
                icon = 'fa-' + icon;
            }
            savePlatformIconType('font');
            savePlatformIcon(icon);
            renderPlatformIcon();
            closeModal();
            showToast('图标已更新', 'success');
        }

        function editPlatformTitle() {
            const current = loadPlatformTitle();
            const newTitle = prompt('请输入平台标题：', current);
            if (newTitle !== null && newTitle.trim() !== '') {
                savePlatformTitle(newTitle.trim());
                showToast('标题已更新', 'success');
            }
        }

        // ---- 模块树渲染 ----
        function renderModuleList() {
            moduleListEl.innerHTML = '';
            const dashboardBtn = document.createElement('button');
            dashboardBtn.className = 'dashboard-btn';
            dashboardBtn.innerHTML = '<i class="fas fa-chart-pie"></i> 📊 数据看板';
            dashboardBtn.addEventListener('click', () => {
                selectModule(DASHBOARD_ID);
            });
            moduleListEl.appendChild(dashboardBtn);

            const roots = getRootModules();
            if (roots.length === 0) {
                const emptyMsg = document.createElement('div');
                emptyMsg.style.cssText = 'text-align:center;color:#b0a090;padding:20px 0;font-size:14px;';
                emptyMsg.innerHTML = '<i class="fas fa-folder-open" style="font-size:24px;display:block;margin-bottom:8px;opacity:0.4;"></i>暂无模块，请点击下方添加';
                moduleListEl.appendChild(emptyMsg);
            } else {
                roots.forEach(root => {
                    const node = renderTreeNode(root, 0);
                    moduleListEl.appendChild(node);
                });
            }
            const addBtn = document.createElement('button');
            addBtn.className = 'add-module';
            addBtn.innerHTML = '<i class="fas fa-file-upload"></i> 上传文件创建顶级模块';
            addBtn.addEventListener('click', () => showAddModuleModal(null));
            moduleListEl.appendChild(addBtn);
            const countSpan = document.createElement('div');
            countSpan.className = 'module-count';
            countSpan.id = 'moduleCount';
            countSpan.textContent = `共 ${getAllModules().length} 个模块`;
            moduleListEl.appendChild(countSpan);
            updateTitle();
            renderToolbar();
        }

        function renderTreeNode(mod, depth) {
            const nodeDiv = document.createElement('div');
            nodeDiv.className = 'tree-node';
            nodeDiv.dataset.id = mod.id;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'node-content' + (mod.id === currentModuleId ? ' active' : '');
            contentDiv.style.paddingLeft = (depth * 18 + 8) + 'px';

            const children = getChildModules(mod.id);
            const toggleBtn = document.createElement('button');
            toggleBtn.className = 'toggle-btn';
            if (children.length > 0) {
                const isExpanded = expandedNodes.has(mod.id);
                toggleBtn.innerHTML = isExpanded ? '<i class="fas fa-chevron-down"></i>' : '<i class="fas fa-chevron-right"></i>';
                toggleBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleExpand(mod.id);
                });
            } else {
                toggleBtn.innerHTML = '<span style="display:inline-block;width:14px;"></span>';
                toggleBtn.style.cursor = 'default';
            }
            contentDiv.appendChild(toggleBtn);

            const nameSpan = document.createElement('span');
            nameSpan.className = 'mod-name';
            const icon = mod.id.startsWith('mod_') ? 'cube' : 'flag';
            nameSpan.innerHTML = `<i class="fas fa-${icon}"></i>${escapeHtml(mod.name)}`;
            contentDiv.appendChild(nameSpan);

            const actions = document.createElement('div');
            actions.className = 'node-actions';
            const addChildBtn = document.createElement('button');
            addChildBtn.innerHTML = '<i class="fas fa-plus-circle" style="color:#28a745;"></i>';
            addChildBtn.title = '添加子模块';
            addChildBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                showAddModuleModal(mod.id);
            });
            actions.appendChild(addChildBtn);
            const upBtn = document.createElement('button');
            upBtn.className = 'move-up';
            upBtn.innerHTML = '<i class="fas fa-chevron-up"></i>';
            upBtn.title = '上移';
            upBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                moveModuleNode(mod.id, -1);
            });
            actions.appendChild(upBtn);
            const downBtn = document.createElement('button');
            downBtn.className = 'move-down';
            downBtn.innerHTML = '<i class="fas fa-chevron-down"></i>';
            downBtn.title = '下移';
            downBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                moveModuleNode(mod.id, 1);
            });
            actions.appendChild(downBtn);
            const delBtn = document.createElement('button');
            delBtn.className = 'del-mod';
            delBtn.innerHTML = '<i class="fas fa-times"></i>';
            delBtn.title = '删除模块及其子模块';
            delBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                deleteModule(mod.id);
            });
            actions.appendChild(delBtn);
            contentDiv.appendChild(actions);

            contentDiv.addEventListener('click', () => {
                selectModule(mod.id);
            });

            nodeDiv.appendChild(contentDiv);

            if (children.length > 0 && expandedNodes.has(mod.id)) {
                const childContainer = document.createElement('div');
                childContainer.className = 'children';
                children.forEach(child => {
                    const childNode = renderTreeNode(child, depth + 1);
                    childContainer.appendChild(childNode);
                });
                nodeDiv.appendChild(childContainer);
            }

            return nodeDiv;
        }

        function toggleExpand(modId) {
            if (expandedNodes.has(modId)) {
                expandedNodes.delete(modId);
            } else {
                expandedNodes.add(modId);
            }
            renderModuleList();
        }

        function moveModuleNode(modId, direction) {
            const mod = getAllModules().find(m => m.id === modId);
            if (!mod) return;
            const parentId = mod.parentId;
            const siblings = getAllModules().filter(m => m.parentId === parentId);
            const idx = siblings.findIndex(m => m.id === modId);
            if (idx === -1) return;
            const targetIdx = idx + direction;
            if (targetIdx < 0 || targetIdx >= siblings.length) return;
            const sibling = siblings[targetIdx];
            const all = appData.modules;
            const idxA = all.indexOf(mod);
            const idxB = all.indexOf(sibling);
            if (idxA === -1 || idxB === -1) return;
            [all[idxA], all[idxB]] = [all[idxB], all[idxA]];
            saveData(appData);
            renderModuleList();
            showToast('模块顺序已调整', 'info', 1200);
        }

        // ---- 选择模块 ----
        function selectModule(modId) {
            if (!modId) return;
            if (modId === DASHBOARD_ID) {
                currentModuleId = DASHBOARD_ID;
                selectedIds.clear();
                searchKeyword = '';
                globalSearchKeyword = '';
                renderModuleList();
                renderDashboard();
                return;
            }
            const mod = getAllModules().find(m => m.id === modId);
            if (!mod) {
                if (getAllModules().length > 0) {
                    modId = getAllModules()[0].id;
                } else {
                    currentModuleId = null;
                    renderModuleList();
                    renderEmpty();
                    return;
                }
            }
            currentModuleId = modId;
            selectedIds.clear();
            searchKeyword = '';
            globalSearchKeyword = '';
            renderModuleList();
            renderRecords(modId);
        }

        function renderEmpty() {
            tableWrap.innerHTML = `
                <div class="empty-tip">
                    <i class="fas fa-inbox"></i>
                    请从左侧选择一个模块，或添加新模块开始使用
                </div>
            `;
            currentModuleTitle.textContent = '请选择模块';
            renderToolbar();
            searchBar.style.display = 'none';
            if (searchInfo) searchInfo.textContent = '';
        }

        function updateTitle() {
            if (currentModuleId === DASHBOARD_ID) {
                currentModuleTitle.textContent = '📊 数据看板';
                return;
            }
            const mod = getAllModules().find(m => m.id === currentModuleId);
            currentModuleTitle.textContent = mod ? mod.name : '请选择模块';
        }

        // ---- 获取文档的所有可搜索文本 ----
        function getDocumentSearchText(rec) {
            let texts = [];
            if (rec['标题']) texts.push(rec['标题']);
            if (rec['内容']) {
                let content = rec['内容'];
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = content;
                const textContent = tempDiv.textContent || tempDiv.innerText || '';
                if (textContent.trim()) texts.push(textContent.trim());
                texts.push(content);
            }
            const fields = ['日期', '来源', '备注'];
            fields.forEach(f => {
                if (rec[f]) texts.push(rec[f]);
            });
            return texts.join(' ');
        }

        // ---- 高亮搜索关键词 ----
        function highlightKeyword(text, keyword) {
            if (!keyword || !text) return text;
            try {
                const escaped = keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const regex = new RegExp(escaped, 'gi');
                return text.replace(regex, match => `<span class="search-highlight">${match}</span>`);
            } catch (e) { return text; }
        }

        // ---- 渲染文档列表 ----
        function renderRecords(modId) {
            const mod = getAllModules().find(m => m.id === modId);
            if (!mod) { renderEmpty(); return; }
            if (!mod.fields || mod.fields.length === 0) {
                mod.fields = ['标题', '内容', '日期'];
                saveData(appData);
            }
            const records = appData.records[modId] || [];
            currentModuleTitle.textContent = mod.name;

            searchBar.style.display = 'flex';
            if (searchInput) searchInput.value = searchKeyword;

            let filteredRecords = records;
            let searchInfoText = '';
            if (searchKeyword.trim() !== '') {
                const keyword = searchKeyword.trim().toLowerCase();
                filteredRecords = records.filter(rec => {
                    const searchText = getDocumentSearchText(rec).toLowerCase();
                    return searchText.includes(keyword);
                });
                const total = records.length;
                const found = filteredRecords.length;
                searchInfoText = `找到 ${found} 篇 / 共 ${total} 篇`;
            } else {
                searchInfoText = `共 ${records.length} 篇文档`;
            }
            if (searchInfo) searchInfo.textContent = searchInfoText;

            if (filteredRecords.length === 0) {
                const msg = records.length === 0 ?
                    '当前模块暂无文档，请点击“新建文档”或导入文件' :
                    `没有找到包含 “<strong>${escapeHtml(searchKeyword.trim())}</strong>” 的文档`;
                tableWrap.innerHTML = `
                    <div class="no-search-result">
                        <i class="fas fa-search"></i>
                        ${msg}
                    </div>
                `;
                renderToolbar();
                return;
            }

            let html = `<div class="record-list">`;
            filteredRecords.forEach((rec, idx) => {
                const title = rec['标题'] || `文档 #${idx+1}`;
                let content = rec['内容'] || '';
                const date = rec['日期'] || '';
                const checked = selectedIds.has(rec.id) ? 'checked' : '';

                let displayTitle = title;
                let displayContent = content;
                if (searchKeyword.trim() !== '') {
                    displayTitle = highlightKeyword(title, searchKeyword.trim());
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = content;
                    const textContent = tempDiv.textContent || tempDiv.innerText || '';
                    if (textContent) {
                        const highlightedText = highlightKeyword(textContent, searchKeyword.trim());
                        displayContent = highlightedText.replace(/\n/g, '<br>');
                    } else {
                        displayContent = content;
                    }
                }

                html += `<div class="record-card" data-rec-id="${rec.id}">`;
                html += `<div class="card-checkbox"><input type="checkbox" class="doc-checkbox" data-id="${rec.id}" ${checked} onchange="toggleDocSelect('${rec.id}')" /></div>`;
                html += `<div class="card-title">
                            <span>${displayTitle}</span>
                            <div class="card-actions">
                                <button class="edit" onclick="showEditDocumentModal('${modId}','${rec.id}')" title="编辑"><i class="fas fa-pen"></i></button>
                                <button class="del" onclick="deleteRecord('${modId}','${rec.id}')" title="删除"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>`;
                html += `<div class="card-body">`;
                if (displayContent) {
                    if (/<table/i.test(displayContent)) {
                        html += `<div class="resize-table-container">${displayContent}</div>`;
                    } else {
                        html += `<div class="content-html">${displayContent}</div>`;
                    }
                }
                if (date) {
                    html += `<div class="meta-info">📅 ${escapeHtml(date)}</div>`;
                }
                html += `</div></div>`;
            });
            html += `</div>`;

            html += `
                <div class="batch-toolbar" style="margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;padding:8px 16px;border-radius:8px;box-shadow:var(--shadow);">
                    <label style="font-size:14px;display:flex;align-items:center;gap:6px;">
                        <input type="checkbox" id="selectAllDocs" onchange="toggleAllDocs()" /> 全选
                    </label>
                    <button class="danger" onclick="batchDeleteDocs()" style="padding:4px 16px;border:none;border-radius:20px;background:#c0392b;color:#fff;cursor:pointer;font-size:13px;">
                        <i class="fas fa-trash-alt"></i> 一键删除选中
                    </button>
                    <button onclick="printSelectedDocs()" style="padding:4px 16px;border:none;border-radius:20px;background:#2c6b9e;color:#fff;cursor:pointer;font-size:13px;">
                        <i class="fas fa-print"></i> 打印选中
                    </button>
                    <span style="font-size:13px;color:#6a5a4a;">已选 <span id="selectedCount">${selectedIds.size}</span> 篇</span>
                </div>
            `;

            tableWrap.innerHTML = html;
            renderToolbar();
            updateSelectedCount();
        }

        // ---- 文档复选框操作 ----
        function toggleDocSelect(recId) {
            const cb = document.querySelector(`.doc-checkbox[data-id="${recId}"]`);
            if (!cb) return;
            if (cb.checked) {
                selectedIds.add(recId);
            } else {
                selectedIds.delete(recId);
            }
            updateSelectedCount();
            const allCbs = document.querySelectorAll('.doc-checkbox');
            const allChecked = allCbs.length > 0 && Array.from(allCbs).every(c => c.checked);
            const selectAll = document.getElementById('selectAllDocs');
            if (selectAll) selectAll.checked = allChecked;
        }

        function toggleAllDocs() {
            const selectAll = document.getElementById('selectAllDocs');
            if (!selectAll) return;
            const checked = selectAll.checked;
            const allCbs = document.querySelectorAll('.doc-checkbox');
            allCbs.forEach(cb => {
                cb.checked = checked;
                const id = cb.dataset.id;
                if (checked) selectedIds.add(id);
                else selectedIds.delete(id);
            });
            updateSelectedCount();
        }

        function updateSelectedCount() {
            const el = document.getElementById('selectedCount');
            if (el) el.textContent = selectedIds.size;
        }

        function batchDeleteDocs() {
            if (selectedIds.size === 0) {
                showToast('请先勾选要删除的文档', 'error');
                return;
            }
            if (!confirm(`确定要删除选中的 ${selectedIds.size} 篇文档吗？此操作不可撤销！`)) return;
            const records = appData.records[currentModuleId];
            if (!records) { showToast('文档不存在', 'error'); return; }
            const idsToDelete = new Set(selectedIds);
            const newRecords = records.filter(r => !idsToDelete.has(r.id));
            appData.records[currentModuleId] = newRecords;
            selectedIds.clear();
            saveData(appData);
            renderRecords(currentModuleId);
            showToast(`已成功删除 ${idsToDelete.size} 篇文档`, 'success');
        }

        function printSelectedDocs() {
            if (selectedIds.size === 0) {
                showToast('请先勾选要打印的文档', 'error');
                return;
            }
            const cards = document.querySelectorAll('.record-card');
            if (cards.length === 0) {
                showToast('没有找到文档', 'error');
                return;
            }
            const originals = [];
            cards.forEach(card => {
                const id = card.dataset.recId;
                if (!selectedIds.has(id)) {
                    card.style.display = 'none';
                    originals.push({ card, display: 'none' });
                } else {
                    card.style.display = '';
                    originals.push({ card, display: '' });
                }
            });
            window.print();
            const restore = () => {
                originals.forEach(({ card, display }) => {
                    card.style.display = display;
                });
                window.onafterprint = null;
            };
            if (window.onafterprint !== undefined) {
                window.onafterprint = restore;
            } else {
                setTimeout(restore, 500);
            }
        }

        // ---- 模块内搜索 ----
        function searchRecords() {
            const keyword = searchInput ? searchInput.value.trim() : '';
            searchKeyword = keyword;
            if (currentModuleId && currentModuleId !== DASHBOARD_ID) {

        function clearSearch() {

            window.insertText = function(openTag, closeTag) {

                textarea.value = before + openTag + selected + closeTag + after;

            window.insertTable = function() {
                const textarea = document.getElementById('docContent');

                const tableHtml = `<table border="1" cellpadding="4" style="border-collapse:collapse;width:100%;">

            window.uploadImageToEditor = function() {

                input.type = 'file';
                input.accept = 'image/*';

                    reader.onload = function(ev) {
                        const imgHtml = `<img src="${ev.target.result}" style="max-width:100%;" />`;
                        const textarea = document.getElementById('docContent');
                        if (textarea) {
                            const start = textarea.selectionStart;
                            const text = textarea.value;
                            textarea.value = text.substring(0, start) + imgHtml + text.substring(start);
                            textarea.focus();
                        }
                    };
                    reader.readAsDataURL(file);
                };
                input.click();
            };

            setTimeout(() => {
                document.getElementById('docTitle').focus();

        function confirmNewDocument(modId) {
            const title = document.getElementById('docTitle').value.trim();

        // ---- 导入Word ----
        async function importWord(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (typeof mammoth === 'undefined') {
                showToast('Word解析库未加载，请检查网络连接后刷新页面重试', 'error');
                event.target.value = '';
                return;
            }

            const ext = file.name.split('.').pop().toLowerCase();
            if (ext !== 'docx') {
                showToast('仅支持 .docx 格式的Word文档', 'error');
                event.target.value = '';
                return;
            }

            if (!currentModuleId || currentModuleId === DASHBOARD_ID) {
                showToast('请先选择一个模块再导入Word', 'error');
                event.target.value = '';
                return;
            }

            const mod = getAllModules().find(m => m.id === currentModuleId);
            if (!mod) {
                showToast('模块不存在', 'error');
                event.target.value = '';
                return;
            }

            try {
                const arrayBuffer = await readFileAsArrayBuffer(file);
                const result = await mammoth.convertToHtml({ arrayBuffer });
                const html = result.value;
                let title = file.name.replace(/\.[^.]+$/, '');
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const firstP = doc.querySelector('p');
                if (firstP && firstP.textContent.trim().length > 0) {
                    title = firstP.textContent.trim().substring(0, 50);
                }
                const newRecord = {
                    id: 'rec_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                    '标题': title,
                    '内容': html,
                    '日期': new Date().toISOString().slice(0, 10)
                };
                if (!appData.records[currentModuleId]) appData.records[currentModuleId] = [];
                appData.records[currentModuleId].push(newRecord);
                if (!mod.fields) mod.fields = ['标题', '内容', '日期'];
                ['标题', '内容', '日期'].forEach(f => {
                    if (!mod.fields.includes(f)) mod.fields.push(f);
                });
                saveData(appData);
                renderRecords(currentModuleId);
                showToast('Word文档导入成功', 'success');
            } catch (err) {
                showToast('导入失败：' + err.message, 'error');
                console.error(err);
            } finally {
                event.target.value = '';
            }
        }

        function readFileAsArrayBuffer(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.onerror = (e) => reject(new Error('文件读取失败'));
                reader.readAsArrayBuffer(file);
            });
        }

        // ---- 导入Excel ----
        function importExcel(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (!currentModuleId || currentModuleId === DASHBOARD_ID) {
                showToast('请先选择一个模块', 'error');
                event.target.value = '';
                return;
            }
            const mod = getAllModules().find(m => m.id === currentModuleId);
            if (!mod) { showToast('模块不存在', 'error');
                event.target.value = ''; return; }

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const jsonData = XLSX.utils.sheet_to_json(firstSheet);
                    if (!jsonData || jsonData.length === 0) {
                        showToast('Excel文件为空', 'error');
                        event.target.value = '';
                        return;
                    }
                    const headers = Object.keys(jsonData[0]);
                    if (headers.length < 2) {
                        showToast('至少需要2列数据', 'error');
                        event.target.value = '';
                        return;
                    }

                    mod.fields = headers;

                    const records = jsonData.map(row => {
                        const rec = { id: 'rec_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6) };
                        headers.forEach(h => {
                            rec[h] = row[h] !== undefined ? String(row[h]).trim() : '';
                        });
                        return rec;
                    }).filter(r => headers.some(h => r[h] && r[h].length > 0));

                    let tableHtml =
                        `<table border="1" cellpadding="4" style="border-collapse:collapse;width:100%;">`;
                    tableHtml += `<thead><tr>${headers.map(h => `<th>${escapeHtml(h)}</th>`).join('')}</tr></thead>`;
                    tableHtml += `<tbody>`;
                    jsonData.forEach(row => {
                        tableHtml +=
                            `<tr>${headers.map(h => `<td>${escapeHtml(row[h] !== undefined ? String(row[h]) : '')}</td>`).join('')}</tr>`;
                    });
                    tableHtml += `</tbody></table>`;

                    const title = file.name.replace(/\.[^.]+$/, '') || 'Excel数据';
                    const newRecord = {
                        id: 'rec_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                        '标题': title,

        function deleteRecord(modId, recId) {
            if (!modId || !recId) {
                showToast('参数错误', 'error');
                return;
            }
            if (!confirm('确定要删除此文档吗？')) return;
            const records = appData.records[modId];
            if (!records) { showToast('文档不存在', 'error'); return; }
            const idx = records.findIndex(r => r.id === recId);
            if (idx === -1) { showToast('文档不存在', 'error'); return; }
            records.splice(idx, 1);
            selectedIds.delete(recId);
            saveData(appData);
            renderRecords(modId);
            showToast('文档已删除', 'success');
        }

        // ---- 删除模块 ----
        function deleteModule(modId) {
            if (!modId) return;
            const mod = getAllModules().find(m => m.id === modId);
            if (!mod) return;
            const children = getChildModules(modId);
            let confirmMsg = `确定要删除模块「${mod.name}」及其所有文档吗？`;
            if (children.length > 0) {
                confirmMsg += `\n该模块下有 ${children.length} 个子模块，将被一并删除！`;
            }
            if (!confirm(confirmMsg)) return;

            function deleteSubmodules(parentId) {
                const subs = getAllModules().filter(m => m.parentId === parentId);
                subs.forEach(sub => {
                    deleteSubmodules(sub.id);
                    appData.modules = appData.modules.filter(m => m.id !== sub.id);
                    delete appData.records[sub.id];
                    dashboardConfig.modules = dashboardConfig.modules.filter(c => c.id !== sub.id);
                });
            }
            deleteSubmodules(modId);
            appData.modules = appData.modules.filter(m => m.id !== modId);
            delete appData.records[modId];
            dashboardConfig.modules = dashboardConfig.modules.filter(c => c.id !== modId);
            saveData(appData);
            saveDashboardConfig(dashboardConfig);
            if (currentModuleId === modId) {
                const remaining = getAllModules();
                if (remaining.length > 0) {
                    currentModuleId = remaining[0].id;
                } else {
                    currentModuleId = DASHBOARD_ID;
                }
            }
            renderModuleList();
            if (currentModuleId === DASHBOARD_ID) {
                renderDashboard();
            } else {
                renderRecords(currentModuleId);
            }
            showToast(`模块「${mod.name}」已删除`, 'success');
        }
