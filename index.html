        // ============================================================
        //  ★★★ 统计公式核心 ★★★
        // ============================================================

        function parseNumericValue(val) {
            if (val === null || val === undefined || val === '') return NaN;
            if (typeof val === 'number') return val;
            let str = String(val).trim();
            let percent = false;
            if (str.endsWith('%')) {
                percent = true;
                str = str.slice(0, -1).trim();
            }
            str = str.replace(/,/g, '');
            const num = parseFloat(str);
            if (isNaN(num)) return NaN;
            return percent ? num / 100 : num;
        }

        function parseCompareCondition(condition) {
            const match = condition.match(/^(<=|>=|<|>)\s*(.+)$/);
            if (match) {
                const op = match[1];
                const val = parseFloat(match[2].trim());
                if (!isNaN(val)) {
                    return { op, val };
                }
            }
            return null;
        }

        function calculateFormula(formula, modId, fields, records) {
            try {
                const expr = formula.expression.trim();

                const allRecords = appData.records[modId] || [];
                let dataRows = [];
                allRecords.forEach(rec => {
                    if (rec._rawData && Array.isArray(rec._rawData)) {
                        dataRows = dataRows.concat(rec._rawData);
                    }
                });

                if (dataRows.length === 0) {
                    return '请导入Excel数据';
                }

                const countifMatch = expr.match(/^COUNTIF\s*\(\s*([^,]+)\s*,\s*(.+)\s*\)$/i);
                if (countifMatch) {
                    const fieldName = countifMatch[1].trim();
                    let condition = countifMatch[2].trim().replace(/^["']|["']$/g, '');
                    const firstRow = dataRows[0];
                    const field = Object.keys(firstRow).find(k => k.toLowerCase() === fieldName.toLowerCase());
                    if (!field) return '字段不存在';

                    const compare = parseCompareCondition(condition);
                    if (compare) {
                        let count = 0;
                        dataRows.forEach(row => {
                            const raw = row[field] !== undefined ? row[field] : '';
                            const num = parseFloat(raw);
                            if (isNaN(num)) return;
                            let match = false;
                            switch (compare.op) {
                                case '<':
                                    match = num < compare.val;
                                    break;
                                case '>':
                                    match = num > compare.val;
                                    break;
                                case '<=':
                                    match = num <= compare.val;
                                    break;
                                case '>=':
                                    match = num >= compare.val;
                                    break;
                                default:
                                    match = false;
                            }
                            if (match) count++;
                        });
                        return count;
                    } else {
                        let count = 0;
                        dataRows.forEach(row => {
                            const val = row[field] !== undefined ? String(row[field]).trim() : '';
                            if (val === condition) count++;
                        });
                        return count;
                    }
                }

                const countifsMatch = expr.match(/^COUNTIFS\s*\(\s*(.+)\s*\)$/i);
                if (countifsMatch) {
                    const params = countifsMatch[1].trim();
                    let parts = [];
                    let current = '';
                    let inQuotes = false;
                    for (let i = 0; i < params.length; i++) {
                        const ch = params[i];
                        if (ch === '"') inQuotes = !inQuotes;
                        if (ch === ',' && !inQuotes) {
                            parts.push(current.trim());
                            current = '';
                        } else {
                            current += ch;
                        }
                    }
                    if (current) parts.push(current.trim());
                    if (parts.length % 2 !== 0) return '参数必须成对（字段, 条件）';
                    let conditions = [];
                    for (let i = 0; i < parts.length; i += 2) {
                        let fieldName = parts[i].trim();
                        let condition = parts[i + 1].trim().replace(/^["']|["']$/g, '');
                        conditions.push({ field: fieldName, value: condition });
                    }
                    if (conditions.length === 0) return '条件为空';
                    let count = 0;
                    dataRows.forEach(row => {
                        let match = true;
                        for (let cond of conditions) {
                            const field = Object.keys(row).find(k => k.toLowerCase() === cond.field.toLowerCase());
                            if (!field) { match = false; break; }
                            const raw = row[field] !== undefined ? row[field] : '';
                            const compare = parseCompareCondition(cond.value);
                            if (compare) {
                                const num = parseFloat(raw);
                                if (isNaN(num)) { match = false; break; }
                                let ok = false;
                                switch (compare.op) {
                                    case '<':
                                        ok = num < compare.val;
                                        break;
                                    case '>':
                                        ok = num > compare.val;
                                        break;
                                    case '<=':
                                        ok = num <= compare.val;
                                        break;
                                    case '>=':
                                        ok = num >= compare.val;
                                        break;
                                    default:
                                        ok = false;
                                }
                                if (!ok) { match = false; break; }
                            } else {
                                const val = String(raw).trim();
                                if (val !== cond.value) { match = false; break; }
                            }
                        }
                        if (match) count++;
                    });
                    return count;
                }

                const vlookupMatch = expr.match(/^VLOOKUP\s*\(\s*([^,]+)\s*,\s*([^,]+)\s*,\s*([^,]+)\s*\)$/i);
                if (vlookupMatch) {
                    const lookupValue = vlookupMatch[1].trim().replace(/^["']|["']$/g, '');
                    const targetModuleName = vlookupMatch[2].trim().replace(/^["']|["']$/g, '');
                    const returnField = vlookupMatch[3].trim().replace(/^["']|["']$/g, '');
                    const targetMod = getAllModules().find(m => m.name === targetModuleName);
                    if (!targetMod) return '目标模块不存在';
                    const targetRecords = appData.records[targetMod.id] || [];
                    let targetDataRows = [];
                    targetRecords.forEach(rec => {
                        if (rec._rawData && Array.isArray(rec._rawData)) {
                            targetDataRows = targetDataRows.concat(rec._rawData);
                        }
                    });
                    if (targetDataRows.length === 0) return '目标模块无数据';
                    const keyField = Object.keys(targetDataRows[0])[0];
                    if (!keyField) return '目标模块无字段';
                    const retField = Object.keys(targetDataRows[0]).find(f => f.toLowerCase() === returnField
                        .toLowerCase());
                    if (!retField) return '返回字段不存在';
                    const found = targetDataRows.find(row => String(row[keyField]).trim() === lookupValue);
                    if (found) return found[retField] !== undefined ? found[retField] : '';
                    return '未找到匹配';
                }

                const funcMatch = expr.match(/^(SUM|AVG|COUNT|MAX|MIN)\s*\(\s*(.+)\s*\)$/i);
                if (funcMatch) {
                    const func = funcMatch[1].toUpperCase();
                    const fieldName = funcMatch[2].trim();

                    if (func === 'COUNT') {
                        return dataRows.length;
                    }

                    const firstRow = dataRows[0];
                    const field = Object.keys(firstRow).find(k => k.toLowerCase() === fieldName.toLowerCase());
                    if (!field) return '字段不存在';
                    const values = dataRows.map(row => {
                        const raw = row[field] !== undefined ? row[field] : '';
                        return parseNumericValue(raw);
                    }).filter(v => !isNaN(v));
                    if (values.length === 0) return '无有效数据';
                    let result;
                    switch (func) {
                        case 'SUM':
                            result = values.reduce((s, v) => s + v, 0);
                            break;
                        case 'AVG':
                            result = values.reduce((s, v) => s + v, 0) / values.length;
                            break;
                        case 'MAX':
                            result = Math.max(...values);
                            break;
                        case 'MIN':
                            result = Math.min(...values);
                            break;
                        default:
                            return '不支持';
                    }
                    if (Number.isInteger(result)) return result;
                    return result.toFixed(2);
                }

                return '格式错误';
            } catch (e) {
                return '错误';
            }
        }

        // ---- 生成卡片HTML ----
        function generateCardHtml(mod, isStandalone = false) {
            const records = appData.records[mod.id] || [];
            const fields = mod.fields || [];
            const configMap = {};
            dashboardConfig.modules.forEach(cfg => { configMap[cfg.id] = cfg; });
            const cfg = configMap[mod.id] || { note: '', formulas: [] };
            const note = cfg.note || '';
            const formulas = cfg.formulas || [];

            let formulaHtml = '';
            if (formulas.length > 0) {
                formulaHtml = `<div class="formula-result">`;
                formulas.forEach((fm, idx) => {
                    const result = calculateFormula(fm, mod.id, fields, records);
                    const editMode = isDashboardEditMode;
                    formulaHtml += `
                        <div class="formula-item">
                            <span class="fname">${escapeHtml(fm.name)}</span>
                            <span class="fvalue">${result}</span>
                            ${editMode ? `
                            <div class="formula-actions">
                                <button class="edit-fm" onclick="editSingleFormula('${mod.id}', ${idx})" title="编辑公式"><i class="fas fa-pen"></i></button>
                                <button class="del-fm" onclick="deleteSingleFormula('${mod.id}', ${idx})" title="删除公式"><i class="fas fa-trash"></i></button>
                            </div>` : ''}
                        </div>
                    `;
                });
                formulaHtml += `</div>`;
            }

            let latestTitle = '无';
            let latestDate = '';
            if (records.length > 0) {
                const sorted = [...records].sort((a, b) => (b['日期'] || '').localeCompare(a['日期'] || ''));
                const latest = sorted[0];
                latestTitle = latest['标题'] || '未命名';
                latestDate = latest['日期'] || '';
            }

            let actionsHtml = '';
            if (isDashboardEditMode) {
                actionsHtml = `
                    <div class="card-actions-edit">
                        <button onclick="moveDashboardCard('${mod.id}', -1)" title="上移"><i class="fas fa-chevron-up"></i></button>
                        <button onclick="moveDashboardCard('${mod.id}', 1)" title="下移"><i class="fas fa-chevron-down"></i></button>
                        <button onclick="editModuleName('${mod.id}')" title="修改名称"><i class="fas fa-pen"></i></button>
                        <button onclick="editModuleNote('${mod.id}')" title="备注"><i class="fas fa-sticky-note"></i></button>
                        <button onclick="toggleModuleVisibility('${mod.id}')" title="${cfg.visible === false ? '显示' : '隐藏'}"><i class="fas fa-eye${cfg.visible === false ? '-slash' : ''}"></i></button>
                        <button onclick="deleteModule('${mod.id}')" title="删除模块" style="color:#c0392b;"><i class="fas fa-trash"></i></button>
                    </div>
                `;
            }

            return `
                <div class="dashboard-card">
                    <div class="card-header">
                        <h3><i class="fas fa-flag" style="color:var(--gold);margin-right:6px;"></i>${escapeHtml(mod.name)}</h3>
                        ${actionsHtml}
                    </div>
                    <div class="card-stats">
                        <div class="stat-item"><strong>${records.length}</strong> 条记录</div>
                        <div class="stat-item"><strong>${fields.length}</strong> 个字段</div>
                        ${latestDate ? `<div class="stat-item">📅 ${escapeHtml(latestDate)}</div>` : ''}
                    </div>
                    ${note ? `<div class="card-note"><i class="fas fa-pencil-alt" style="margin-right:6px;color:var(--gold);"></i>${escapeHtml(note)}</div>` : ''}
                    ${formulaHtml}
                    <div class="latest-doc">📄 最近：${escapeHtml(latestTitle)}</div>
                    ${isDashboardEditMode ? `<button class="add-stat-btn" onclick="showAddStatModal('${mod.id}')"><i class="fas fa-plus"></i> 添加统计</button>` : ''}
                </div>
            `;
        }

        // ---- 看板渲染 ----
        function renderDashboard() {
            currentModuleTitle.textContent = '📊 数据看板';
            const allModules = getAllModules();
            const totalRecords = allModules.reduce((sum, m) => sum + (appData.records[m.id] || []).length, 0);
            const today = new Date().toISOString().slice(0, 10);
            let todayNew = 0;
            allModules.forEach(m => {
                const recs = appData.records[m.id] || [];
                recs.forEach(r => {
                    if (r['日期'] === today) todayNew++;
                });
            });

            searchBar.style.display = 'none';
            if (searchInfo) searchInfo.textContent = '';

            let searchHtml = `
                <div class="dashboard-search-bar">
                    <i class="fas fa-search" style="color:var(--gold);font-size:16px;"></i>
                    <input type="text" id="globalSearchInput" placeholder="🔍 搜索全部模块（标题/内容）..." value="${escapeHtml(globalSearchKeyword)}" onkeydown="if(event.key==='Enter') searchAllModules();" />
                    <button onclick="searchAllModules()"><i class="fas fa-search"></i> 搜索</button>
                    <button class="clear-btn" onclick="clearGlobalSearch()"><i class="fas fa-times"></i> 清除</button>
                    <span class="info" id="globalSearchInfo"></span>
                </div>
            `;

            let searchResultsHtml = '';
            let searchResults = [];
            if (globalSearchKeyword.trim() !== '') {
                const kw = globalSearchKeyword.trim().toLowerCase();
                allModules.forEach(mod => {
                    const recs = appData.records[mod.id] || [];
                    recs.forEach(rec => {
                        const searchText = getDocumentSearchText(rec).toLowerCase();
                        if (searchText.includes(kw)) {
                            searchResults.push({ mod, rec });
                        }
                    });
                });
                searchResults.sort((a, b) => {
                    const aTitle = (a.rec['标题'] || '').toLowerCase().includes(kw);
                    const bTitle = (b.rec['标题'] || '').toLowerCase().includes(kw);
                    if (aTitle && !bTitle) return -1;
                    if (!aTitle && bTitle) return 1;
                    return 0;
                });
                const infoEl = document.getElementById('globalSearchInfo');
                if (infoEl) {
                    infoEl.textContent = `找到 ${searchResults.length} 篇文档`;
                }
                if (searchResults.length > 0) {
                    searchResultsHtml = `
                        <div class="search-results-list">
                            ${searchResults.map(({mod, rec}) => {
                                const title = rec['标题'] || '无标题';
                                const content = rec['内容'] || '';
                                let snippet = content.replace(/<[^>]+>/g, ' ').substring(0, 150) + (content.length > 150 ? '...' : '');
                                if (globalSearchKeyword.trim() !== '') {
                                    const kw = globalSearchKeyword.trim();
                                    const highlightedTitle = highlightKeyword(title, kw);
                                    const highlightedSnippet = highlightKeyword(snippet, kw);
                                    return `
                                        <div class="search-result-item" onclick="showDocPreview('${mod.id}','${rec.id}')">
                                            <div class="result-mod"><i class="fas fa-folder"></i> ${escapeHtml(mod.name)}</div>
                                            <div class="result-title">${highlightedTitle}</div>
                                            <div class="result-snippet">${highlightedSnippet}</div>
                                            <div class="result-meta">📅 ${escapeHtml(rec['日期'] || '')}</div>
                                        </div>
                                    `;
                                }
                                return `
                                    <div class="search-result-item" onclick="showDocPreview('${mod.id}','${rec.id}')">
                                        <div class="result-mod"><i class="fas fa-folder"></i> ${escapeHtml(mod.name)}</div>
                                        <div class="result-title">${escapeHtml(title)}</div>
                                        <div class="result-snippet">${escapeHtml(snippet)}</div>
                                        <div class="result-meta">📅 ${escapeHtml(rec['日期'] || '')}</div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    `;
                } else {
                    searchResultsHtml = `<div class="no-search-result"><i class="fas fa-search"></i> 未找到包含 “${escapeHtml(globalSearchKeyword)}” 的文档</div>`;
                }
            }

            let statsHtml = `
                <div class="dashboard-stats">
                    <div class="stat-box"><div class="number">${allModules.length}</div><div class="label">📁 总模块</div></div>
                    <div class="stat-box"><div class="number">${totalRecords}</div><div class="label">📄 总文档</div></div>
                    <div class="stat-box"><div class="number">${todayNew}</div><div class="label">📅 今日新增</div></div>
                </div>
            `;

            let mainHtml = '';
            if (globalSearchKeyword.trim() === '') {
                const configMap = {};
                dashboardConfig.modules.forEach(cfg => {
                    configMap[cfg.id] = cfg;
                });

                const roots = getRootModules();
                roots.sort((a, b) => {
                    const idxA = dashboardConfig.modules.findIndex(c => c.id === a.id);
                    const idxB = dashboardConfig.modules.findIndex(c => c.id === b.id);
                    if (idxA === -1 && idxB === -1) return 0;
                    if (idxA === -1) return 1;
                    if (idxB === -1) return -1;
                    return idxA - idxB;
                });

                const groupRoots = roots.filter(r => getChildModules(r.id).length > 0);
                const standaloneRoots = roots.filter(r => getChildModules(r.id).length === 0);

                if (standaloneRoots.length > 0) {
                    mainHtml += `<div class="dashboard-group"><div class="group-header"><span>📌 基础信息</span></div><div class="dashboard-grid">`;
                    standaloneRoots.forEach(mod => {
                        const cfg = configMap[mod.id] || { visible: true };
                        if (cfg.visible === false) return;
                        mainHtml += generateCardHtml(mod, true);
                    });
                    mainHtml += `</div></div>`;
                }

                groupRoots.forEach(root => {
                    const rootCfg = configMap[root.id] || { visible: true };
                    if (rootCfg.visible === false) return;

                    const children = getChildModules(root.id).filter(child => {
                        const cfg = configMap[child.id] || { visible: true };
                        return cfg.visible !== false;
                    });
                    if (children.length === 0) return;

                    mainHtml += `<div class="dashboard-group">`;
                    mainHtml += `<div class="group-header">
                        <span>${escapeHtml(root.name)}</span>
                        ${isDashboardEditMode ? `
                        <div class="group-actions">
                            <button onclick="moveDashboardCard('${root.id}', -1)" title="上移分组"><i class="fas fa-chevron-up"></i></button>
                            <button onclick="moveDashboardCard('${root.id}', 1)" title="下移分组"><i class="fas fa-chevron-down"></i></button>
                            <button onclick="editModuleName('${root.id}')" title="修改名称"><i class="fas fa-pen"></i></button>
                            <button onclick="editModuleNote('${root.id}')" title="备注"><i class="fas fa-sticky-note"></i></button>
                            <button onclick="toggleModuleVisibility('${root.id}')" title="${rootCfg.visible === false ? '显示' : '隐藏'}"><i class="fas fa-eye${rootCfg.visible === false ? '-slash' : ''}"></i></button>
                            <button onclick="deleteModule('${root.id}')" title="删除分组（含子模块）" style="color:#c0392b;"><i class="fas fa-trash"></i></button>
                        </div>
                        ` : ''}
                    </div>`;

                    const rootRecords = appData.records[root.id] || [];
                    mainHtml += `<div class="dashboard-list">`;
                    if (rootRecords.length > 0) {
                        mainHtml += generateCardHtml(root, false);
                    }
                    children.forEach(child => {
                        mainHtml += generateCardHtml(child, false);
                    });
                    mainHtml += `</div></div>`;
                });

                if (mainHtml === '') {
                    mainHtml = `<div class="empty-tip"><i class="fas fa-inbox"></i> 暂无模块数据</div>`;
                }
            }

            // ★ 保留看板中的"统计示例"按钮
            const editBtnHtml = `
                <div style="margin-bottom:16px;display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap;">
                    <button class="primary" onclick="toggleDashboardEdit()" style="padding:6px 20px;border-radius:30px;border:none;background:var(--gold);color:var(--dark-red);cursor:pointer;font-weight:600;">
                        <i class="fas fa-${isDashboardEditMode ? 'save' : 'edit'}"></i> ${isDashboardEditMode ? '保存看板' : '编辑看板'}
                    </button>
                    <button onclick="showTemplateHelp()" style="padding:6px 20px;border-radius:30px;border:1px solid var(--gold);background:#fff;color:var(--dark-red);cursor:pointer;font-weight:500;">
                        <i class="fas fa-lightbulb"></i> 统计示例
                    </button>
                </div>
            `;

            let finalHtml = searchHtml + statsHtml + editBtnHtml;
            if (globalSearchKeyword.trim() !== '') {
                finalHtml += searchResultsHtml;
            } else {
                finalHtml += mainHtml;
            }

            tableWrap.innerHTML = finalHtml;
            renderToolbar();
        }

        // ---- 全局搜索 ----
        function searchAllModules() {
            const keyword = document.getElementById('globalSearchInput')?.value?.trim() || '';
            globalSearchKeyword = keyword;
            renderDashboard();
        }

        function clearGlobalSearch() {
            const input = document.getElementById('globalSearchInput');
            if (input) input.value = '';
            globalSearchKeyword = '';
            renderDashboard();
        }

        // ---- 看板编辑功能 ----
        function toggleDashboardEdit() {
            if (isDashboardEditMode) {
                saveDashboardConfig(dashboardConfig);
                showToast('看板配置已保存', 'success');
            }
            isDashboardEditMode = !isDashboardEditMode;
            renderDashboard();
        }

        function editModuleName(modId) {
            const mod = getAllModules().find(m => m.id === modId);
            if (!mod) return;
            const newName = prompt('请输入新的模块名称：', mod.name);
            if (newName !== null && newName.trim() !== '') {
                mod.name = newName.trim();
                saveData(appData);
                renderDashboard();
                renderModuleList();
                showToast('模块名称已更新', 'success');
            }
        }

        function editModuleNote(modId) {
            const cfg = dashboardConfig.modules.find(c => c.id === modId);
            const currentNote = cfg ? cfg.note || '' : '';
            const newNote = prompt('请输入该模块的备注信息：', currentNote);
            if (newNote === null) return;
            let configItem = dashboardConfig.modules.find(c => c.id === modId);
            if (!configItem) {
                configItem = { id: modId, visible: true, note: '', formulas: [] };
                dashboardConfig.modules.push(configItem);
            }
            configItem.note = newNote.trim();
            renderDashboard();
            showToast('备注已更新', 'success');
        }

        function toggleModuleVisibility(modId) {
            let cfg = dashboardConfig.modules.find(c => c.id === modId);
            if (!cfg) {
                cfg = { id: modId, visible: true, note: '', formulas: [] };
                dashboardConfig.modules.push(cfg);
            }
            cfg.visible = (cfg.visible === undefined) ? false : !cfg.visible;
            renderDashboard();
            showToast(cfg.visible ? '模块已显示' : '模块已隐藏', 'info');
        }

        function moveDashboardCard(modId, direction) {
            const idx = dashboardConfig.modules.findIndex(c => c.id === modId);
            if (idx === -1) {
                dashboardConfig.modules.push({ id: modId, visible: true, note: '', formulas: [] });
                const newIdx = dashboardConfig.modules.findIndex(c => c.id === modId);
                if (newIdx === -1) return;
                const targetIdx = newIdx + direction;
                if (targetIdx < 0 || targetIdx >= dashboardConfig.modules.length) return;
                [dashboardConfig.modules[newIdx], dashboardConfig.modules[targetIdx]] = [dashboardConfig.modules[
                    targetIdx], dashboardConfig.modules[newIdx]];
                renderDashboard();
                return;
            }
            const targetIdx = idx + direction;
            if (targetIdx < 0 || targetIdx >= dashboardConfig.modules.length) return;
            [dashboardConfig.modules[idx], dashboardConfig.modules[targetIdx]] = [dashboardConfig.modules[targetIdx],
                dashboardConfig.modules[idx]
            ];
            saveDashboardConfig(dashboardConfig);
            renderDashboard();
        }

        // ---- 文档预览 ----
        function showDocPreview(modId, recId) {
            const mod = getAllModules().find(m => m.id === modId);
            if (!mod) { showToast('模块不存在', 'error'); return; }
            const records = appData.records[modId] || [];
            const rec = records.find(r => r.id === recId);
            if (!rec) { showToast('文档不存在', 'error'); return; }

            const title = rec['标题'] || '无标题';
            const content = rec['内容'] || '';
            const date = rec['日期'] || '';

            modalTitle.innerHTML = `<i class="fas fa-file-alt"></i> ${escapeHtml(title)}`;
            modalBody.innerHTML = `
                <div style="margin-bottom:6px;font-size:12px;color:#6a5a4a;">
                    <span style="background:#f5ede4;padding:1px 10px;border-radius:12px;"><i class="fas fa-folder"></i> ${escapeHtml(mod.name)}</span>
                    ${date ? `<span style="margin-left:8px;">📅 ${escapeHtml(date)}</span>` : ''}
                    <button onclick="jumpToModule('${modId}')" style="margin-left:8px;padding:1px 12px;border:none;border-radius:16px;background:var(--gold);color:var(--dark-red);cursor:pointer;font-size:11px;font-weight:600;">跳转到模块</button>
                </div>
                <div style="border-top:1px solid #f0e8e0;padding-top:8px;max-height:55vh;overflow-y:auto;">${content || '<div style="color:#999;text-align:center;padding:16px 0;">（文档内容为空）</div>'}</div>
                <div class="form-actions"><button class="btn-cancel" onclick="closeModal()">关闭</button></div>
            `;
            modalOverlay.classList.add('show');
        }

        function jumpToModule(modId) { closeModal();
            selectModule(modId); }

        // ---- 添加统计 ----
        function showAddStatModal(modId) {
            const mod = getAllModules().find(m => m.id === modId);
            if (!mod) return;
            const fields = mod.fields || [];
            if (fields.length === 0) {
                showToast('该模块没有字段，无法添加统计', 'error');
                return;
            }
            modalTitle.innerHTML = `<i class="fas fa-chart-line"></i> 添加统计指标 - ${mod.name}`;
            let html = `
                <div class="form-group">
                    <label>指标名称（显示名称）</label>
                    <input type="text" id="statName" placeholder="例如：18-45岁人数" />
                </div>
                <div class="form-group">
                    <label>统计字段</label>
                    <select id="statField">
                        ${fields.map(f => `<option value="${escapeHtml(f)}">${escapeHtml(f)}</option>`).join('')}
                    </select>
                </div>
                <div class="form-group">
                    <label>统计类型</label>
                    <select id="statType">
                        <option value="COUNT">计数 (COUNT)</option>
                        <option value="SUM">求和 (SUM)</option>
                        <option value="AVG">平均值 (AVG)</option>
                        <option value="MAX">最大值 (MAX)</option>
                        <option value="MIN">最小值 (MIN)</option>
                        <option value="COUNTIF">条件计数 (COUNTIF)</option>
                        <option value="COUNTIFS" selected>多条件计数 (COUNTIFS)</option>
                        <option value="VLOOKUP">查找引用 (VLOOKUP)</option>
                    </select>
                </div>
                <div class="form-group" id="conditionGroup">
                    <label>条件（COUNTIF/COUNTIFS 使用，多个条件用逗号分隔，字段和条件成对，条件用双引号）</label>
                    <input type="text" id="statCondition" placeholder='例如：年龄, ">=18", 年龄, "<=45"' />
                    <div style="font-size:12px;color:#999;margin-top:4px;">
                        💡 支持比较运算符：<code>&lt;</code> <code>&gt;</code> <code>&lt;=</code> <code>&gt;=</code>
                    </div>
                </div>
                <div class="form-group" id="vlookupGroup" style="display:none;">
                    <label>目标模块名（仅VLOOKUP需要）</label>
                    <input type="text" id="vlookupModule" placeholder="例如：党员信息" />
                    <label style="margin-top:6px;">返回字段</label>
                    <input type="text" id="vlookupReturn" placeholder="例如：联系电话" />
                </div>
                <div class="help-tip">
                    <strong>📌 示例：统计 18~45 岁人数</strong><br>
                    字段选 <code>年龄</code>，类型选 <code>COUNTIFS</code>，条件填 <code>年龄, ">=18", 年龄, "<=45"</code>
                </div>
                <div class="form-actions">
                    <button class="btn-cancel" onclick="closeModal()">取消</button>
                    <button class="btn-submit" onclick="confirmAddStat('${modId}')">添加</button>
                </div>
            `;
            modalBody.innerHTML = html;
            modalOverlay.classList.add('show');

            const statType = document.getElementById('statType');
            const conditionGroup = document.getElementById('conditionGroup');
            const vlookupGroup = document.getElementById('vlookupGroup');
            statType.addEventListener('change', function() {
                conditionGroup.style.display = (this.value === 'COUNTIF' || this.value === 'COUNTIFS') ? 'block' :
                    'none';
                vlookupGroup.style.display = this.value === 'VLOOKUP' ? 'block' : 'none';
            });

            conditionGroup.style.display = 'block';
            vlookupGroup.style.display = 'none';
        }

        function confirmAddStat(modId) {
            const name = document.getElementById('statName').value.trim();
            const field = document.getElementById('statField').value;
            const type = document.getElementById('statType').value;
            if (!name) {
                showToast('请输入指标名称', 'error');
                return;
            }
            let expression = '';
            if (type === 'COUNTIF') {
                const condition = document.getElementById('statCondition').value.trim();
                if (!condition) {
                    showToast('请输入条件', 'error');
                    return;
                }
                expression = `COUNTIF(${field}, ${condition})`;
            } else if (type === 'COUNTIFS') {
                const condStr = document.getElementById('statCondition').value.trim();
                if (!condStr) {
                    showToast('请输入条件对', 'error');
                    return;
                }
                expression = `COUNTIFS(${condStr})`;
            } else if (type === 'VLOOKUP') {
                const targetModule = document.getElementById('vlookupModule').value.trim();
                const returnField = document.getElementById('vlookupReturn').value.trim();
                if (!targetModule || !returnField) {
                    showToast('请输入目标模块名和返回字段', 'error');
                    return;
                }
                const mod = getAllModules().find(m => m.id === modId);
                const firstField = mod && mod.fields && mod.fields.length > 0 ? mod.fields[0] : '姓名';
                expression = `VLOOKUP(${firstField}, "${targetModule}", "${returnField}")`;
            } else {
                expression = `${type}(${field})`;
            }

            let cfg = dashboardConfig.modules.find(c => c.id === modId);
            if (!cfg) {
                cfg = { id: modId, visible: true, note: '', formulas: [] };
                dashboardConfig.modules.push(cfg);
            }
            if (!cfg.formulas) cfg.formulas = [];
            cfg.formulas.push({ name: name, expression: expression });
            saveDashboardConfig(dashboardConfig);
            closeModal();
            renderDashboard();
            showToast(`统计指标 "${name}" 已添加`, 'success');
        }

        function deleteSingleFormula(modId, idx) {
            let cfg = dashboardConfig.modules.find(c => c.id === modId);
            if (!cfg || !cfg.formulas || cfg.formulas.length <= idx) return;
            const formulaName = cfg.formulas[idx].name;
            if (!confirm(`确定要删除公式 "${formulaName}" 吗？`)) return;
            cfg.formulas.splice(idx, 1);
            saveDashboardConfig(dashboardConfig);
            renderDashboard();
            showToast(`公式 "${formulaName}" 已删除`, 'success');
        }

        // ---- 编辑公式 ----
        window.insertFormulaField = function(field) {
            const input = document.getElementById('editFormulaExpr');
            if (!input) return;
            const start = input.selectionStart;
            const end = input.selectionEnd;
            const text = input.value;
            const before = text.substring(0, start);
            const after = text.substring(end);
            input.value = before + field + after;
            const newCursor = start + field.length;
            input.selectionStart = newCursor;
            input.selectionEnd = newCursor;
            input.focus();
        };
        window.insertFormulaText = function(text) {
            const input = document.getElementById('editFormulaExpr');
            if (!input) return;
            const start = input.selectionStart;
            const end = input.selectionEnd;
            const textVal = input.value;
            const before = textVal.substring(0, start);
            const after = textVal.substring(end);
            input.value = before + text + after;
            const newCursor = start + text.length;
            input.selectionStart = newCursor;
            input.selectionEnd = newCursor;
            input.focus();
        };
        window.previewFormula = function(modId, idx) {
            const exprInput = document.getElementById('editFormulaExpr');
            if (!exprInput) return;
            const expr = exprInput.value.trim();
            if (!expr) {
                document.getElementById('formulaPreviewResult').textContent = '⚠️ 请输入表达式';
                return;
            }
            const mod = getAllModules().find(m => m.id === modId);
            if (!mod) {
                document.getElementById('formulaPreviewResult').textContent = '❌ 模块不存在';
                return;
            }
            const records = appData.records[modId] || [];
            const fields = mod.fields || [];
            const tempFormula = { name: '预览', expression: expr };
            const result = calculateFormula(tempFormula, modId, fields, records);
            const previewEl = document.getElementById('formulaPreviewResult');
            if (typeof result === 'number' || typeof result === 'string') {
                previewEl.innerHTML = `✅ 计算结果：<strong>${result}</strong>`;
            } else {
                previewEl.innerHTML = `❌ 计算错误：${result}`;
            }
        };

        function editSingleFormula(modId, idx) {
            let cfg = dashboardConfig.modules.find(c => c.id === modId);
            if (!cfg || !cfg.formulas || cfg.formulas.length <= idx) return;
            const fm = cfg.formulas[idx];
            const mod = getAllModules().find(m => m.id === modId);
            if (!mod) return;
            const fields = mod.fields || [];

            let fieldBtns = fields.map(f =>
                `<button type="button" onclick="window.insertFormulaField('${escapeHtml(f)}')" style="margin:2px;padding:2px 8px;border:1px solid #d0c0b0;border-radius:4px;background:#f5ede4;cursor:pointer;font-size:12px;">${escapeHtml(f)}</button>`
            ).join('');

            let funcBtns = ['SUM', 'AVG', 'COUNT', 'MAX', 'MIN', 'COUNTIF', 'COUNTIFS', 'VLOOKUP'].map(f =>
                `<button type="button" onclick="window.insertFormulaText('${f}(')" style="margin:2px;padding:2px 8px;border:1px solid #d0c0b0;border-radius:4px;background:#f5ede4;cursor:pointer;font-size:12px;">${f}</button>`
            ).join('');

            modalTitle.innerHTML = `<i class="fas fa-calculator"></i> 编辑公式 - ${mod.name}`;
            modalBody.innerHTML = `
                <div style="background:#fcf8f2;border-left:4px solid var(--gold);padding:8px 12px;margin-bottom:12px;font-size:13px;color:#4a3a2a;">
                    <strong><i class="fas fa-info-circle" style="color:var(--gold);"></i> 支持函数</strong><br>
                    <code>SUM(字段)</code> 求和 &nbsp; <code>AVG(字段)</code> 平均 &nbsp; <code>COUNT(字段)</code> 计数 &nbsp; 
                    <code>MAX(字段)</code> 最大 &nbsp; <code>MIN(字段)</code> 最小 &nbsp; 
                    <code>COUNTIF(字段, "条件")</code> 单条件计数（支持 <, >, <=, >=）&nbsp; 
                    <code>COUNTIFS(字段1, "条件1", 字段2, "条件2", ...)</code> 多条件计数（支持比较运算符）&nbsp; 
                    <code>VLOOKUP(查找值, "目标模块名", "返回字段")</code> 跨模块查找
                    <br><span style="font-size:12px;color:#999;">💡 字段名区分大小写，字符串条件请用双引号包围</span>
                </div>

                <div style="margin-bottom:8px;">
                    <span style="font-weight:600;">字段：</span> ${fieldBtns}
                </div>
                <div style="margin-bottom:12px;">
                    <span style="font-weight:600;">函数：</span> ${funcBtns}
                    <span style="font-size:12px;color:#999;margin-left:8px;">点击后插入到光标位置</span>
                </div>

                <div class="form-group">
                    <label>指标名称</label>
                    <input type="text" id="editFormulaName" value="${escapeHtml(fm.name)}" />
                </div>
                <div class="form-group">
                    <label>表达式</label>
                    <div style="display:flex;gap:8px;align-items:center;">
                        <input type="text" id="editFormulaExpr" value="${escapeHtml(fm.expression)}" style="flex:1;" />
                        <button type="button" onclick="window.previewFormula('${modId}', ${idx})" style="padding:6px 16px;background:var(--gold);color:var(--dark-red);border:none;border-radius:30px;font-weight:600;cursor:pointer;white-space:nowrap;">
                            <i class="fas fa-eye"></i> 预览结果
                        </button>
                    </div>
                    <div id="formulaPreviewResult" style="margin-top:6px;font-size:14px;color:var(--dark-red);font-weight:500;min-height:20px;"></div>
                </div>

                <div class="form-actions">
                    <button class="btn-cancel" onclick="closeModal()">取消</button>
                    <button class="btn-submit" onclick="saveSingleFormula('${modId}', ${idx})">保存</button>
                </div>
            `;
            modalOverlay.classList.add('show');
        }

        function saveSingleFormula(modId, idx) {
            const name = document.getElementById('editFormulaName').value.trim();
            const expr = document.getElementById('editFormulaExpr').value.trim();
            if (!name || !expr) {
                showToast('名称和表达式不能为空', 'error');
                return;
            }
            let cfg = dashboardConfig.modules.find(c => c.id === modId);
            if (!cfg) {
                cfg = { id: modId, visible: true, note: '', formulas: [] };
                dashboardConfig.modules.push(cfg);
            }
            if (!cfg.formulas) cfg.formulas = [];
            if (idx >= cfg.formulas.length) {
                showToast('公式索引错误', 'error');
                return;
            }
            cfg.formulas[idx] = { name, expression: expr };
            saveDashboardConfig(dashboardConfig);
            closeModal();
            renderDashboard();
            showToast('公式已更新', 'success');
        }

        // ---- 统计示例（仅在看板中保留） ----
        function showTemplateHelp() {
            modalTitle.innerHTML = `<i class="fas fa-lightbulb"></i> 村务统计示例（年龄段统计）`;
            modalBody.innerHTML = `
                <div class="help-tip">
                    <strong>📌 如何统计年龄段人数（如 18~45 岁）</strong>
                </div>
                <div style="font-size:14px;color:#4a3a2a;line-height:1.8;">
                    <p>1️⃣ 先导入包含 <strong>年龄</strong> 字段的 Excel 数据（如村民信息表）。</p>
                    <p>2️⃣ 进入 <strong>数据看板</strong>，在对应模块卡片中点击 <strong>“添加统计”</strong>。</p>
                    <p>3️⃣ 填写指标名称（如 <code>18-45岁人数</code>），统计类型选 <strong>COUNTIFS</strong>。</p>
                    <p>4️⃣ 在条件框中输入：</p>
                    <div style="background:#f5ede4;padding:10px 14px;border-radius:6px;margin:6px 0;font-family:monospace;font-size:14px;">
                        年龄, ">=18", 年龄, "<=45"
                    </div>
                    <p>5️⃣ 点击保存，看板即可显示 <strong>18~45 岁</strong> 年龄段的人数。</p>
                    <hr style="border:0;border-top:1px solid #f0e8e0;margin:12px 0;" />
                    <p><strong>📊 更多统计公式示例：</strong></p>
                    <ul style="padding-left:20px;">
                        <li><code>COUNTIF(年龄, ">60")</code> — 统计大于60岁的人数</li>
                        <li><code>COUNTIF(政治面貌, "党员")</code> — 统计党员人数</li>
                        <li><code>SUM(收入)</code> — 求和</li>
                        <li><code>AVG(年龄)</code> — 平均年龄</li>
                        <li><code>VLOOKUP(姓名, "村民信息", "联系电话")</code> — 跨模块查找</li>
                    </ul>
                    <p style="margin-top:10px;color:#999;font-size:12px;">💡 字段名需与 Excel 列名完全一致（区分大小写）</p>
                </div>
                <div class="form-actions">
                    <button class="btn-cancel" onclick="closeModal()">关闭</button>
                </div>
            `;
            modalOverlay.classList.add('show');
        }

        // ---- 工具栏渲染（已移除模块内的“统计示例”按钮） ----
        function renderToolbar() {
            const isDashboard = currentModuleId === DASHBOARD_ID;
            const mod = isDashboard ? null : getAllModules().find(m => m.id === currentModuleId);
            let btns = '';

            btns += `<button onclick="refreshCurrentView()"><i class="fas fa-sync-alt"></i> 刷新</button>`;

            if (!isDashboard && mod) {
                btns += `<button class="add-btn" onclick="showNewDocumentModal('${mod.id}')"><i class="fas fa-plus"></i> 新建文档</button>`;
                btns +=
                    `<button class="upload-img" onclick="uploadImageForModule('${mod.id}')"><i class="fas fa-image"></i> 上传图片</button>`;
                btns +=
                    `<button class="template" onclick="document.getElementById('importWordFile').click()" style="background:#17a2b8;border-color:#17a2b8;color:#fff;"><i class="fas fa-file-word"></i> 导入Word</button>`;
                btns += `<input type="file" id="importWordFile" class="hidden-input" accept=".docx" onchange="importWord(event)" />`;
                btns +=
                    `<button class="excel" onclick="document.getElementById('importExcelFile').click()"><i class="fas fa-file-import"></i> 导入Excel</button>`;
                btns += `<input type="file" id="importExcelFile" class="hidden-input" accept=".xlsx,.xls" onchange="importExcel(event)" />`;
                btns += `<button onclick="printModule()"><i class="fas fa-print"></i> 打印</button>`;
                // ★ 已移除“统计示例”按钮
            }

            toolbarContainer.innerHTML = btns;
        }

        // ---- 打印当前模块 ----
        function printModule() {
            if (currentModuleId === DASHBOARD_ID) {
                showToast('请先选择一个模块', 'error');
                return;
            }
            const mod = getAllModules().find(m => m.id === currentModuleId);
            if (!mod) {
                showToast('模块不存在', 'error');
                return;
            }
            window.print();
        }

        // ---- 导出/导入JSON ----
        function exportAllData() {
            const data = {
                modules: appData.modules,
                records: appData.records,
                dashboardConfig: dashboardConfig,
                platformTitle: loadPlatformTitle(),
                platformIcon: loadPlatformIcon(),
                platformIconType: loadPlatformIconType(),
                platformIconData: loadPlatformIconData(),
                exportedAt: new Date().toISOString()
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `村务平台数据_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('数据导出成功', 'success');
        }

        function importAllData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (!imported.modules || !imported.records) {
                        showToast('数据格式无效', 'error');
                        return;
                    }
                    if (!confirm('导入将覆盖当前所有数据（不含用户账户），确定继续吗？')) return;
                    appData.modules = imported.modules;
                    appData.records = imported.records;
                    if (imported.dashboardConfig) dashboardConfig = imported.dashboardConfig;
                    if (imported.platformTitle) savePlatformTitle(imported.platformTitle);
                    if (imported.platformIcon) savePlatformIcon(imported.platformIcon);
                    if (imported.platformIconType) savePlatformIconType(imported.platformIconType);
                    if (imported.platformIconData) savePlatformIconData(imported.platformIconData);
                    saveData(appData);
                    saveDashboardConfig(dashboardConfig);
                    renderPlatformIcon();
                    document.getElementById('platformTitleDisplay').textContent = loadPlatformTitle();
                    currentModuleId = DASHBOARD_ID;
                    renderModuleList();
                    renderDashboard();
                    showToast('数据导入成功！', 'success');
                } catch (err) {
                    showToast('导入失败：' + err.message, 'error');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // ---- 刷新 ----
        function refreshCurrentView() {
            if (currentModuleId === DASHBOARD_ID) {
                renderDashboard();
            } else if (currentModuleId) {
                renderRecords(currentModuleId);
            } else if (getAllModules().length > 0) {
                selectModule(getAllModules()[0].id);
            } else {
                renderEmpty();
            }
            showToast('已刷新', 'info', 1000);
        }

        // ---- 模态框 ----
        function closeModal() {
            modalOverlay.classList.remove('show');
        }
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // ---- 初始化 ----
        function initPlatform() {
            if (!appData.modules || appData.modules.length === 0) {
                appData.modules = [];
                appData.records = {};
                dashboardConfig.modules = [];
                saveData(appData);
                saveDashboardConfig(dashboardConfig);
            }

            expandedNodes = new Set();
            appData.modules.forEach(m => {
                if (getChildModules(m.id).length > 0) {
                    expandedNodes.add(m.id);
                }
            });

            currentModuleId = DASHBOARD_ID;
            renderModuleList();
            renderDashboard();
        }

        // ---- 启动 ----
        (function checkSession() {
            const session = getSession();
            if (session) {
                showMainApp();
            } else {
                document.getElementById('loginOverlay').classList.remove('hidden');
            }
        })();

        console.log('✅ 平台已加载，表格列宽可手动拖拽调整，内容自动换行。模块内“统计示例”已移除。');
    </script>
</body>
</html>
