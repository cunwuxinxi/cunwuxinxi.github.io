<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>党建引领 · 村务信息平台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js">
    </script>
    <style>
        /* ===== 全局样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --red: #b22222;
            --dark-red: #8b1a1a;
            --gold: #d4a843;
            --bg-light: #fdf8f0;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
            --radius: 12px;
            --font: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            font-family: var(--font);
            background: var(--bg-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== 登录覆盖层 ===== */
        #loginOverlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(145deg, #8b0000, #b22222, #cc3333);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(circle at 30% 20%, rgba(255, 215, 0, 0.08) 0%, transparent 60%),
                radial-gradient(circle at 70% 80%, rgba(255, 215, 0, 0.05) 0%, transparent 50%);
        }
        #loginOverlay.hidden {
            display: none;
        }
        .login-box {
            background: rgba(255, 252, 248, 0.95);
            backdrop-filter: blur(4px);
            border-radius: var(--radius);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), 0 0 0 2px rgba(212, 168, 67, 0.3);
            max-width: 420px;
            width: 100%;
            padding: 40px 36px;
            border-top: 6px solid var(--gold);
            position: relative;
            overflow: hidden;
        }
        .login-box::before {
            content: '';
            position: absolute;
            top: -60px;
            right: -60px;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(212, 168, 67, 0.08) 0%, transparent 70%);
            border-radius: 50%;
        }
        .login-box .logo {
            text-align: center;
            margin-bottom: 20px;
        }
        .login-box .logo i {
            font-size: 48px;
            color: var(--red);
            background: rgba(178, 34, 34, 0.1);
            padding: 16px;
            border-radius: 50%;
        }
        .login-box h2 {
            color: var(--dark-red);
            font-size: 24px;
            text-align: center;
            margin-bottom: 4px;
            letter-spacing: 2px;
        }
        .login-box .sub {
            text-align: center;
            color: #6a5a4a;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .login-box .form-group {
            margin-bottom: 18px;
        }
        .login-box .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 4px;
            color: #4a3a2a;
            font-size: 14px;
        }
        .login-box .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e0d0c0;
            border-radius: 8px;
            font-size: 15px;
            transition: 0.2s;
            background: #fffcf8;
            color: #2d2d2d;
        }
        .login-box .form-group input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(212, 168, 67, 0.25);
        }
        .login-box .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        .login-box .form-actions button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.25s;
        }
        .login-box .form-actions .btn-login {
            background: var(--red);
            color: #fff;
            box-shadow: 0 4px 12px rgba(178, 34, 34, 0.3);
        }
        .login-box .form-actions .btn-login:hover {
            background: var(--dark-red);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(178, 34, 34, 0.4);
        }
        .login-box .form-actions .btn-register {
            background: var(--gold);
            color: var(--dark-red);
        }
        .login-box .form-actions .btn-register:hover {
            background: #e8c86a;
            transform: translateY(-2px);
        }
        .login-box .login-error {
            color: #b22222;
            font-size: 13px;
            text-align: center;
            margin-top: 12px;
            background: rgba(178, 34, 34, 0.08);
            padding: 8px;
            border-radius: 6px;
        }
        .login-box .footer-note {
            margin-top: 16px;
            font-size: 12px;
            color: #999;
            text-align: center;
            border-top: 1px solid #f0e8e0;
            padding-top: 14px;
        }

        /* ===== 顶部栏 ===== */
        .topbar {
            background: linear-gradient(135deg, var(--dark-red), var(--red));
            color: #fff;
            padding: 12px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            box-shadow: 0 2px 12px rgba(178, 34, 34, 0.4);
            border-bottom: 3px solid var(--gold);
            position: sticky;
            top: 0;
            z-index: 100;
            gap: 10px;
        }
        .topbar .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 2px;
            flex-shrink: 0;
        }
        .topbar .brand .icon-wrapper {
            position: relative;
            display: inline-block;
            cursor: pointer;
            width: 36px;
            height: 36px;
            overflow: hidden;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--gold);
            transition: 0.2s;
        }
        .topbar .brand .icon-wrapper:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        .topbar .brand .icon-wrapper i {
            font-size: 24px;
            color: var(--gold);
        }
        .topbar .brand .icon-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .topbar .brand .title-text {
            cursor: default;
        }
        .topbar .brand .edit-title {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 16px;
            padding: 0 4px;
            opacity: 0.6;
            transition: 0.2s;
        }
        .topbar .brand .edit-title:hover {
            opacity: 1;
        }
        .topbar .brand small {
            font-size: 14px;
            font-weight: 400;
            opacity: 0.85;
            margin-left: 8px;
            letter-spacing: 0;
        }

        .topbar .datetime-display {
            color: #fff;
            font-size: 15px;
            font-weight: 400;
            margin-right: auto;
            margin-left: 16px;
            letter-spacing: 0.5px;
            background: rgba(255, 255, 255, 0.12);
            padding: 4px 16px;
            border-radius: 20px;
            backdrop-filter: blur(2px);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .topbar .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            flex-shrink: 0;
        }
        .topbar .actions button {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 7px 16px;
            border-radius: 30px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(4px);
        }
        .topbar .actions button:hover {
            background: rgba(255, 255, 255, 0.28);
            border-color: var(--gold);
            transform: translateY(-1px);
        }
        .topbar .actions button.primary {
            background: var(--gold);
            border-color: var(--gold);
            color: var(--dark-red);
            font-weight: 600;
        }

        /* ===== 主体布局 ===== */
        .main-wrap {
            display: flex;
            flex: 1;
            height: calc(100vh - 80px);
            overflow: hidden;
        }
        .sidebar {
            width: 280px;
            min-width: 220px;
            background: #fff9f0;
            border-right: 2px solid #f0e0d0;
            padding: 18px 12px;
            overflow-y: auto;
            box-shadow: 2px 0 12px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .sidebar .tree-node {
            display: flex;
            flex-direction: column;
        }
        .sidebar .tree-node .node-content {
            display: flex;
            align-items: center;
            padding: 5px 8px;
            border-radius: var(--radius);
            cursor: pointer;
            transition: 0.2s;
            gap: 4px;
            font-size: 14px;
            color: #4a3a2a;
            border-left: 3px solid transparent;
            position: relative;
        }
        .sidebar .tree-node .node-content:hover {
            background: #f5ede4;
        }
        .sidebar .tree-node .node-content.active {
            background: #f0e4d4;
            border-left-color: var(--red);
            color: var(--dark-red);
            font-weight: 600;
        }
        .sidebar .tree-node .node-content .toggle-btn {
            background: none;
            border: none;
            cursor: pointer;
            width: 18px;
            color: #9a8a7a;
            font-size: 12px;
            flex-shrink: 0;
        }
        .sidebar .tree-node .node-content .toggle-btn:hover {
            color: #4a3a2a;
        }
        .sidebar .tree-node .node-content .mod-name {
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        .sidebar .tree-node .node-content .mod-name i {
            color: var(--gold);
            margin-right: 4px;
            width: 16px;
        }
        .sidebar .tree-node .node-content .node-actions {
            display: flex;
            gap: 2px;
            flex-shrink: 0;
        }
        .sidebar .tree-node .node-content .node-actions button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 13px;
            color: #6a5a4a;
            padding: 2px 4px;
            border-radius: 4px;
        }
        .sidebar .tree-node .node-content .node-actions button:hover {
            background: #e0d0c0;
            color: #4a3a2a;
        }
        .sidebar .tree-node .node-content .node-actions .del-mod {
            color: #c0392b;
        }
        .sidebar .tree-node .node-content .node-actions .del-mod:hover {
            background: #fde8e8;
            color: #b22222;
        }
        .sidebar .tree-node .node-content .node-actions .move-up,
        .move-down {
            color: #6a5a4a;
        }
        .sidebar .tree-node .node-content .node-actions .move-up:hover,
        .move-down:hover {
            background: #d0c8b8;
        }
        .sidebar .tree-node .children {
            padding-left: 18px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            border-left: 1px dashed #d0c8b8;
            margin-left: 6px;
        }
        .sidebar .add-module {
            margin-top: 12px;
            padding: 12px 16px;
            background: var(--gold);
            color: var(--dark-red);
            border: none;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .sidebar .add-module:hover {
            background: #e8c86a;
            transform: scale(1.02);
        }
        .sidebar .module-count {
            font-size: 12px;
            color: #9a8a7a;
            text-align: center;
            margin-top: 4px;
            border-top: 1px solid #eee;
            padding-top: 12px;
        }
        .sidebar .dashboard-btn {
            padding: 12px 16px;
            background: var(--red);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .sidebar .dashboard-btn:hover {
            background: var(--dark-red);
            transform: scale(1.02);
        }

        .content {
            flex: 1;
            padding: 20px 28px;
            overflow-y: auto;
            background: #fcf8f2;
        }
        .content .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #f0e0d0;
        }
        .content .panel-header h2 {
            font-size: 24px;
            color: var(--dark-red);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .content .panel-header h2 i {
            color: var(--gold);
        }
        .content .panel-header .toolbar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .content .panel-header .toolbar button {
            padding: 6px 16px;
            border-radius: 30px;
            border: 1px solid #d0c0b0;
            background: #fff;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #3d3d3d;
        }
        .content .panel-header .toolbar button:hover {
            background: #f0e8e0;
            border-color: #b0a090;
        }
        .content .panel-header .toolbar button.primary {
            background: var(--red);
            border-color: var(--red);
            color: #fff;
        }
        .content .panel-header .toolbar button.primary:hover {
            background: var(--dark-red);
        }
        .content .panel-header .toolbar button.danger {
            color: #c0392b;
            border-color: #f5c6cb;
        }
        .content .panel-header .toolbar button.danger:hover {
            background: #fde8e8;
            border-color: #c0392b;
        }
        .content .panel-header .toolbar button.excel {
            background: #28a745;
            border-color: #28a745;
            color: #fff;
        }
        .content .panel-header .toolbar button.excel:hover {
            background: #218838;
            border-color: #1e7e34;
        }
        .content .panel-header .toolbar button.template {
            background: #17a2b8;
            border-color: #17a2b8;
            color: #fff;
        }
        .content .panel-header .toolbar button.template:hover {
            background: #138496;
            border-color: #117a8b;
        }
        .content .panel-header .toolbar button.add-btn {
            background: #007bff;
            border-color: #007bff;
            color: #fff;
        }
        .content .panel-header .toolbar button.add-btn:hover {
            background: #0069d9;
            border-color: #0062cc;
        }
        .content .panel-header .toolbar button.upload-img {
            background: #fd7e14;
            border-color: #fd7e14;
            color: #fff;
        }
        .content .panel-header .toolbar button.upload-img:hover {
            background: #e06b0a;
            border-color: #d45a0a;
        }

        /* ===== 表格容器 ===== */
        .resize-table-container {
            resize: both;
            overflow: auto;
            max-width: 100%;
            background: #fff;
            border: 1px solid #e0d0c0;
            padding: 8px;
            border-radius: 4px;
            min-height: 100px;
            min-width: 300px;
        }
        .resize-table-container table {
            width: 100%;
            min-width: 600px;
            border-collapse: collapse;
            font-size: 13px;
        }
        .resize-table-container table th,
        .resize-table-container table td {
            padding: 6px 10px;
            border: 1px solid #d4c8b8;
            white-space: nowrap;
            text-align: left;
        }
        .resize-table-container table th {
            background: #f5ede4;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 2;
        }
        .record-card .card-body {
            max-height: none;
            overflow: visible;
        }

        /* ===== 通用表格样式（含列宽调整与自适应） ===== */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            min-width: 400px;
            background: #fff;
            table-layout: auto;
        }
        table th,
        table td {
            border: 1px solid #d4c8b8;
            padding: 8px 12px;
            text-align: left;
            vertical-align: middle;
            white-space: normal;
            word-break: break-word;
            min-width: 40px;
        }
        table th {
            background: #f5ede4;
            font-weight: 600;
            color: #4a3a2a;
            position: sticky;
            top: 0;
            z-index: 2;
            /* 允许用户拖动调整列宽 */
            resize: horizontal;
            overflow: auto;
            min-width: 60px;
            max-width: 600px;
        }
        table th:first-child {
            text-align: center;
            width: 40px;
            max-width: 60px;
        }
        table tbody tr:nth-child(even) {
            background: #fcf8f2;
        }
        table tbody tr:hover {
            background: #f5ede4;
        }
        table td .row-actions {
            display: flex;
            gap: 4px;
            flex-wrap: nowrap;
            justify-content: center;
        }
        table td .row-actions button {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            font-size: 14px;
            transition: 0.15s;
            color: #6a5a4a;
        }
        table td .row-actions button:hover {
            background: #e0d0c0;
        }
        table td .row-actions button.edit:hover {
            color: var(--dark-red);
        }
        table td .row-actions button.del:hover {
            color: #c0392b;
            background: #fde8e8;
        }

        /* ===== 模块内搜索栏 ===== */
        .search-bar {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            background: #fff;
            padding: 6px 14px;
            border-radius: 8px;
            box-shadow: var(--shadow);
        }
        .search-bar input {
            flex: 1;
            min-width: 180px;
            padding: 8px 14px;
            border: 1.5px solid #d0c0b0;
            border-radius: 30px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
            background: #fffcf8;
        }
        .search-bar input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(212, 168, 67, 0.15);
        }
        .search-bar .search-btn {
            padding: 6px 18px;
            border: none;
            border-radius: 30px;
            background: var(--red);
            color: #fff;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
        }
        .search-bar .search-btn:hover {
            background: var(--dark-red);
        }
        .search-bar .clear-btn {
            padding: 6px 16px;
            border: none;
            border-radius: 30px;
            background: #999;
            color: #fff;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
        }
        .search-bar .clear-btn:hover {
            background: #777;
        }
        .search-bar .search-info {
            font-size: 13px;
            color: #6a5a4a;
            margin-left: auto;
            white-space: nowrap;
        }

        .empty-tip {
            text-align: center;
            color: #b0a090;
            padding: 48px 0;
            font-size: 16px;
        }
        .empty-tip i {
            font-size: 40px;
            display: block;
            margin-bottom: 12px;
            opacity: 0.4;
        }

        /* ===== 看板样式 ===== */
        .dashboard-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .dashboard-stats .stat-box {
            background: #fff;
            border-radius: var(--radius);
            padding: 16px 20px;
            box-shadow: var(--shadow);
            text-align: center;
            border-left: 4px solid var(--gold);
            transition: 0.2s;
        }
        .dashboard-stats .stat-box:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
        }
        .dashboard-stats .stat-box .number {
            font-size: 28px;
            font-weight: 700;
            color: var(--dark-red);
        }
        .dashboard-stats .stat-box .label {
            font-size: 13px;
            color: #6a5a4a;
            margin-top: 4px;
        }

        /* 全局搜索栏（看板） */
        .dashboard-search-bar {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            background: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            box-shadow: var(--shadow);
        }
        .dashboard-search-bar input {
            flex: 1;
            min-width: 200px;
            padding: 8px 14px;
            border: 1.5px solid #d0c0b0;
            border-radius: 30px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
            background: #fffcf8;
        }
        .dashboard-search-bar input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(212, 168, 67, 0.15);
        }
        .dashboard-search-bar button {
            padding: 6px 18px;
            border: none;
            border-radius: 30px;
            background: var(--red);
            color: #fff;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .dashboard-search-bar button:hover {
            background: var(--dark-red);
        }
        .dashboard-search-bar .clear-btn {
            background: #999;
        }
        .dashboard-search-bar .clear-btn:hover {
            background: #777;
        }
        .dashboard-search-bar .info {
            font-size: 13px;
            color: #6a5a4a;
            margin-left: auto;
        }

        /* 搜索结果列表 */
        .search-results-list {

            margin-top: 12px;

        .search-result-item {

        }
        .search-result-item:hover {

        .search-result-item .result-mod {

        .search-result-item .result-title {

            font-weight: 600;
            color: var(--dark-red);

        .search-result-item .result-snippet {

        .dashboard-group {

        }
        .dashboard-group .group-header {

            align-items: center;
            font-size: 20px;

            color: var(--dark-red);
            padding-bottom: 8px;
            border-bottom: 2px solid var(--gold);

        .dashboard-group .group-header .group-actions {
            display: flex;
            gap: 6px;

            border: none;
            cursor: pointer;
            font-size: 14px;
            color: #6a5a4a;
            padding: 2px 6px;
            border-radius: 4px;
            transition: 0.15s;

        .dashboard-group .group-header .group-actions button:hover {
            background: #f0e8e0;

        .dashboard-grid {

            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        .dashboard-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        .dashboard-list .dashboard-card {
            width: 100%;
        }

        .dashboard-card {
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--shadow);

            display: flex;
            flex-direction: column;

        .dashboard-card:hover {

        }
        .dashboard-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }
        .dashboard-card .card-header h3 {
            font-size: 16px;
            color: var(--dark-red);
            flex: 1;
            margin-right: 6px;
            word-break: break-word;
        }
        .dashboard-card .card-header .card-actions-edit {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .dashboard-card .card-header .card-actions-edit button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 12px;
            color: #6a5a4a;
            padding: 2px 6px;
            border-radius: 4px;
            transition: 0.15s;
        }
        .dashboard-card .card-header .card-actions-edit button:hover {
            background: #f0e8e0;
        }
        .dashboard-card .card-stats {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 6px 0 8px 0;
        }
        .dashboard-card .card-stats .stat-item {
            font-size: 13px;
            color: #4a3a2a;
            background: #fcf8f2;
            padding: 2px 10px;
            border-radius: 12px;
        }
        .dashboard-card .card-stats .stat-item strong {
            font-weight: 600;
            color: var(--dark-red);
        }
        .dashboard-card .card-note {
            margin-top: 6px;
            font-size: 13px;
            color: #6a5a4a;
            background: #fcf8f2;
            padding: 4px 10px;
            border-radius: 6px;
            border-left: 3px solid var(--gold);
        }
        .dashboard-card .formula-result {
            margin-top: 8px;
            border-top: 1px solid #f0e8e0;
            padding-top: 8px;
            font-size: 13px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 12px;
        }
        .dashboard-card .formula-result .formula-item {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
            border-bottom: 1px dashed #f5ede4;
        }
        .dashboard-card .formula-result .formula-item .fname {
            color: #6a5a4a;
        }
        .dashboard-card .formula-result .formula-item .fvalue {
            color: var(--dark-red);
            font-weight: 600;
        }
        .dashboard-card .formula-result .formula-item .formula-actions {
            display: flex;
            gap: 2px;
        }
        .dashboard-card .formula-result .formula-item .formula-actions button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 11px;
            color: #6a5a4a;
            padding: 0 4px;
            border-radius: 4px;
        }
        .dashboard-card .formula-result .formula-item .formula-actions button:hover {
            background: #f0e8e0;
        }
        .dashboard-card .formula-result .formula-item .formula-actions .edit-fm {

        }
        .dashboard-card .formula-result .formula-item .formula-actions .edit-fm:hover {
            color: var(--dark-red);
        }
        .dashboard-card .formula-result .formula-item .formula-actions .del-fm {
            color: #c0392b;
        }
        .dashboard-card .formula-result .formula-item .formula-actions .del-fm:hover {
            background: #fde8e8;
        }
        .dashboard-card .latest-doc {
            font-size: 12px;
            color: #6a5a4a;
            margin-top: 6px;
            border-top: 1px solid #f0e8e0;
            padding-top: 6px;
        }
        .dashboard-card .add-stat-btn {
            margin-top: 6px;
            padding: 2px 12px;
            border: 1px dashed var(--gold);
            border-radius: 20px;
            background: none;
            color: var(--gold);
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
            align-self: flex-start;
        }
        .dashboard-card .add-stat-btn:hover {
            background: var(--gold);
            color: #fff;
        }

        /* ===== 文档卡片 ===== */
        .record-card {
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 18px 20px;
            margin-bottom: 16px;
            border-left: 4px solid var(--gold);
            transition: 0.2s;
            position: relative;
        }
        .record-card:hover {
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
        }
        .record-card .card-checkbox {
            position: absolute;
            top: 18px;
            right: 18px;
        }
        .record-card .card-checkbox input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .record-card .card-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--dark-red);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-right: 30px;
        }
        .record-card .card-title .card-actions {
            display: flex;
            gap: 6px;
        }
        .record-card .card-title .card-actions button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            color: #6a5a4a;
            padding: 4px 8px;
            border-radius: 4px;
            transition: 0.15s;
        }
        .record-card .card-title .card-actions button:hover {
            background: #f0e8e0;
        }
        .record-card .card-title .card-actions button.edit:hover {
            color: var(--dark-red);
        }
        .record-card .card-title .card-actions button.del:hover {
            color: #c0392b;
            background: #fde8e8;
        }
        .record-card .card-body {
            font-size: 14px;
            color: #3d3d3d;
            line-height: 1.6;
            overflow: hidden;
            max-height: none;
            overflow: visible;
        }
        .record-card .card-body img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 6px;
            margin: 8px 0;
            border: 1px solid #e0d0c0;
            padding: 4px;
            background: #fff;
            cursor: pointer;
            display: block;
        }
        .record-card .card-body table {
            border-collapse: collapse;
            width: 100%;
            margin: 10px 0;
            font-size: 13px;
            table-layout: auto;
        }
        .record-card .card-body table th,
        .record-card .card-body table td {
            border: 1px solid #d4c8b8;
            padding: 6px 10px;
            text-align: left;
            white-space: normal;
            word-break: break-word;
            min-width: 40px;
        }
        .record-card .card-body table th {
            background: #f5ede4;
            font-weight: 600;
            resize: horizontal;
            overflow: auto;
            min-width: 60px;
            max-width: 600px;
        }
        .record-card .card-body p {
            margin-bottom: 6px;
        }
        .record-card .card-body ul,
        .record-card .card-body ol {
            padding-left: 20px;
            margin-bottom: 6px;
        }
        .record-card .meta-info {
            font-size: 12px;
            color: #999;
            margin-top: 8px;
            border-top: 1px solid #f0e8e0;
            padding-top: 6px;
            text-align: right;
        }

        /* 搜索高亮 */
        .search-highlight {
            background: #ffeb3b !important;
            padding: 0 3px;
            border-radius: 3px;
            font-weight: 700;
            color: #000;
        }

        /* ===== 模态框 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(4px);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal-box {
            background: #fffcf5;
            border-radius: var(--radius);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 700px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 28px 32px;
            border-top: 6px solid var(--gold);
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.92) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .modal-box h3 {
            font-size: 22px;
            color: var(--dark-red);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .modal-box h3 i {
            color: var(--gold);
        }
        .modal-box .form-group {
            margin-bottom: 16px;
        }
        .modal-box .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 4px;
            color: #4a3a2a;
            font-size: 14px;
        }
        .modal-box .form-group input,
        .modal-box .form-group select,
        .modal-box .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #e0d0c0;
            border-radius: 8px;
            font-size: 14px;
            transition: 0.2s;
            background: #fffcf8;
            font-family: inherit;
        }
        .modal-box .form-group input:focus,
        .modal-box .form-group select:focus,
        .modal-box .form-group textarea:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(212, 168, 67, 0.2);
        }
        .modal-box .form-group textarea {
            min-height: 180px;
            resize: vertical;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 14px;
        }
        .modal-box .form-group .editor-toolbar {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }
        .modal-box .form-group .editor-toolbar button {
            padding: 4px 12px;
            border: 1px solid #d0c0b0;
            border-radius: 4px;
            background: #f5ede4;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }
        .modal-box .form-group .editor-toolbar button:hover {
            background: #e0d0c0;
        }
        .modal-box .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #f0e8e0;
        }
        .modal-box .form-actions button {
            padding: 8px 28px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .modal-box .form-actions .btn-cancel {
            background: #f0e8e0;
            color: #4a3a2a;
        }
        .modal-box .form-actions .btn-cancel:hover {
            background: #e0d0c0;
        }
        .modal-box .form-actions .btn-submit {
            background: var(--red);
            color: #fff;
        }
        .modal-box .form-actions .btn-submit:hover {
            background: var(--dark-red);
        }

        .upload-area {
            border: 2px dashed #d0c0b0;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            background: #fcf8f2;
        }
        .upload-area:hover {
            border-color: var(--gold);
            background: #f5ede4;
        }
        .upload-area input {
            display: none;
        }
        .upload-area .hint {
            font-size: 13px;
            color: #6a5a4a;
        }
        .upload-area .hint i {
            margin-right: 6px;
            color: var(--gold);
        }
        .file-selected {
            font-size: 13px;
            color: #28a745;
            margin-top: 6px;
        }
        .image-preview {
            margin-top: 8px;
            max-width: 100%;
        }
        .image-preview img {
            max-width: 200px;
            max-height: 150px;
            border: 1px solid #d0c0b0;
            border-radius: 6px;
            padding: 4px;
            background: #fff;
        }

        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2d2d2d;
            color: #fff;
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.4s, transform 0.4s;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
        }
        .toast-msg.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast-msg.success {
            background: #1e7e34;
        }
        .toast-msg.error {
            background: #b22222;
        }
        .toast-msg.info {
            background: #2c6b9e;
        }

        .hidden-input {
            display: none;
        }

        /* ===== 图标选择 ===== */
        .icon-select-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 12px 0;
        }
        .icon-select-grid .icon-option {
            text-align: center;
            padding: 12px;
            border: 2px solid #e0d0c0;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .icon-select-grid .icon-option:hover {
            border-color: var(--gold);
            background: #f5ede4;
        }
        .icon-select-grid .icon-option.selected {
            border-color: var(--red);
            background: #f0e4d4;
        }
        .icon-select-grid .icon-option i {
            font-size: 28px;
            color: var(--gold);
        }
        .icon-select-grid .icon-option .icon-label {
            font-size: 12px;
            color: #4a3a2a;
            margin-top: 4px;
        }
        .icon-upload-area {
            margin-top: 12px;
            border: 2px dashed #d0c0b0;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            background: #fcf8f2;
        }
        .icon-upload-area:hover {
            border-color: var(--gold);
            background: #f5ede4;
        }
        .icon-upload-area input {
            display: none;
        }
        .icon-upload-area .hint {
            font-size: 13px;
            color: #6a5a4a;
        }
        .icon-upload-area .hint i {
            margin-right: 6px;
            color: var(--gold);
        }
        .icon-preview {
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .icon-preview img {
            max-width: 60px;
            max-height: 60px;
            border-radius: 8px;
            border: 1px solid #e0d0c0;
            padding: 4px;
        }

        /* ===== 帮助提示 ===== */
        .help-tip {
            background: #f5ede4;
            border-left: 4px solid var(--gold);
            padding: 8px 14px;
            border-radius: 4px;
            font-size: 13px;
            color: #4a3a2a;
            margin: 6px 0 12px 0;
        }
        .help-tip code {
            background: #fff;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 12px;
            border: 1px solid #e0d0c0;
        }

        /* ===== 响应式 ===== */
        @media (max-width:768px) {
            .topbar .brand {
                font-size: 18px;
            }
            .topbar .actions button {
                font-size: 12px;
                padding: 5px 12px;
            }
            .sidebar {
                width: 200px;
                min-width: 150px;
            }
            .content {
                padding: 14px 16px;
            }
            .dashboard-grid,
            .dashboard-list {
                grid-template-columns: 1fr;
            }
            .topbar .datetime-display {
                font-size: 13px;
                padding: 2px 12px;
                margin-left: 8px;
            }
        }
        @media (max-width:576px) {
            .main-wrap {
                flex-direction: column;
                height: auto;
            }
            .sidebar {
                width: 100%;
                max-height: 200px;
                flex-direction: column;
            }
            .sidebar .tree-node .children {
                padding-left: 12px;
            }
            .content {
                height: auto;
                min-height: 60vh;
            }
            .topbar .datetime-display {
                display: none;
            }
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f5ede4;
        }
        ::-webkit-scrollbar-thumb {
            background: #d0c0b0;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #b0a090;
        }
        .table-wrap table td img {
            max-width: 80px;
            max-height: 80px;
            border-radius: 6px;
            border: 1px solid #e0d0c0;
            padding: 2px;
            background: #fff;
            object-fit: cover;
        }

        /* ===== 打印样式 ===== */
        @media print {
            .topbar,
            .sidebar,
            .panel-header .toolbar,
            .search-bar,
            .dashboard-stats,
            .dashboard-group .group-actions,
            .card-actions-edit,
            .add-stat-btn,
            .record-card .card-checkbox,
            .record-card .card-title .card-actions,
            .batch-toolbar,
            .topbar .datetime-display {
                display: none !important;
            }
            .record-card {
                border: 1px solid #ccc !important;
                box-shadow: none !important;
                page-break-inside: avoid;
                margin-bottom: 16px;
            }
            .record-card .card-body {
                max-height: none !important;
                overflow: visible !important;
            }
            .record-card .card-title {
                padding-right: 0 !important;
            }
            .dashboard-card {
                border: 1px solid #ccc !important;
                box-shadow: none !important;
                page-break-inside: avoid;
            }
            .dashboard-grid,
            .dashboard-list {
                display: grid !important;
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)) !important;
                gap: 16px !important;
            }
            .dashboard-card .card-header h3 {
                font-size: 16px !important;
            }
            body {
                background: #fff !important;
            }
            .content {
                padding: 10px !important;
                background: #fff !important;
            }
            .panel-header h2 i {
                display: none !important;
            }
            .panel-header h2 {
                font-size: 22px !important;
                text-align: center !important;
                width: 100% !important;
                justify-content: center !important;
                border-bottom: 2px solid #d4a843 !important;
                padding-bottom: 10px !important;
            }
            .panel-header {
                border-bottom: none !important;
            }
            .record-card .meta-info {
                color: #999 !important;
            }
            .print-time {
                display: none !important;
            }
        }
    </style>
</head>
